  ban-reason: "Baneado por un miembro del staff"

  menu-no-players-teleport: "&cNo hay jugadores disponibles para teleportarse."
  menu-no-players-random: "&cNo hay jugadores disponibles para TP aleatorio."
  menu-no-players-mines: "&cNo hay jugadores en las minas actualmente."
  menu-player-offline: "&cEse jugador ya no está conectado."

  smi-usage: "&c&lUSO: &7/smi <jugador>"
  smi-player-not-found: "&c&lERROR: &7Ese jugador no está en línea."
  smi-self: "&c&lERROR: &7No puedes inspeccionar tu propio inventario."
  smi-opened: "&e&lSMI: &7Viendo el inventario de &f%player%&7."

  chest-view-loot: "&cEse contenedor es del mundo y aún no ha sido abierto por ningún jugador."

staffchat:
  format: "&8[&e%Server_name%&8] &9%Staff_name% &8> %message%"
  toggle-enabled: "&aHas activado el &fStaff Chat&a. Ahora todo lo que escribas en el chat se enviará como mensaje de staff."
  toggle-disabled: "&cHas desactivado el &fStaff Chat&c. Tu chat ha vuelto a la normalidad."

  server-leave:
    enabled: true
    format: "&8[&e%Server_name%&8] &c[-] &7El staff &f%Staff_name% &7ha salido de la modalidad."
  server-join:
    enabled: true
    format: "&8[&e%Server_name%&8] &a[+] &7El staff &f%Staff_name% &7ha entrado a la modalidad."

ownerchat:
  format: "&8[&e%Server_name%&8] &8[&4Owner&8] &c%Staff_name% &8> %message%"
  toggle-enabled: "&aHas activado el &fOwner Chat&a. Ahora todo lo que escribas en el chat se enviará como mensaje de owner."
  toggle-disabled: "&cHas desactivado el &fOwner Chat&c. Tu chat ha vuelto a la normalidad."

invsee:
  read-only: true

chest-view:
  enabled: true
  permission: "nstaffmode.use.chestview"
  title: "&8Contenido: &f%container% &8(%x%, %y%, %z%)"
  disabled-worlds: []
  materials:
    - "CHEST"
    - "TRAPPED_CHEST"
    - "BARREL"
    - "*SHULKER_BOX"
    - "HOPPER"
    - "DROPPER"
    - "DISPENSER"
    - "FURNACE"
    - "BLAST_FURNACE"
    - "SMOKER"
    - "BREWING_STAND"

player-info-format:
  - "&8&m----------------------------------"
  - "&e&lInformación de &r&f%player%"
  - ""
  - "&bVida: &f%health%/%max_health%"
  - "&bComida: &f%food%/%max_food%"
  - "&bGamemode: &f%gamemode%"
  - "&bUbicación: &f%world%, %x%, %y%, %z%"
  - "&bPing: &f%ping% ms"
  - "&bVolando: &f%flying%"
  - "&8&m----------------------------------"

freeze-options:
  notification-permission: "nstaffmode.freeze.notify"

  on-freeze:
    chat-messages:
      enabled: true
      lines:
        - "&8&m--------------------------------------------"
        - "          &c&l¡HAS SIDO CONGELADO!"
        - ""
        - " &fNo te desconectes o serás sancionado."
        - " &fEspera a que un miembro del Staff te atienda."
        - "&8&m--------------------------------------------"
    title:
      enabled: true
      title: "&4&l¡CONGELADO!"
      subtitle: "&cNo te muevas o serás sancionado"
    actionbar:
      enabled: true
      text: "&c&lESTÁS CONGELADO &8- &fNo te desconectes."
    potion-effects:
      enabled: true
      effects:
        - "BLINDNESS:1"
        - "WEAKNESS:200"
        - "SLOW:7"
  on-unfreeze:
    chat-message: "&a¡Has sido descongelado! Ya puedes moverte con normalidad."
    title:
      enabled: true
      title: "&a&lERES LIBRE"
      subtitle: "&fYa puedes continuar jugando"

mine-detector:
  mine-worlds:
    - "mine"
    - "mina"
    - "prison"
  messages:
    header: "&8&m--------&r &eJugadores en Minas &8&m--------"
    player-format: "&e- &f%player%"
    no-players-found: "&cNo se encontraron jugadores minando actualmente."

ore-alert:
  enabled: true
  enabled-worlds:
    - "Survival"
    - "Survival_nether"
  blocks:
    - "SPAWNER"
    - "DIAMOND_ORE"
    - "DEEPSLATE_DIAMOND_ORE"
    - "ANCIENT_DEBRIS"
  permission: "nstaffmode.orealert.notify"
  message: "&8[&c&lAlerta&8] &f%player% &7ha minado &e%block% &7en &b%world% &7(%x%, %y%, %z%)"

