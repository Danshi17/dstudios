
#  ALMACENAMIENTO - YML | H2 | SQLITE | MYSQL | MONGODB
storage:
  type: SQLITE
  auto-save-minutes: 2

  mysql:
    host: "localhost"
    port: 3306
    database: "rankup"
    username: "root"
    password: ""
    use-ssl: false
    pool-size: 10

  mongodb:
    uri: "mongodb://localhost:27017"
    database: "rankup"
    collection: "players"

  sqlite:
    file: "database.db"

  h2:
    file: "database"

placeholder-settings:
  progressbar:
    symbol: "│"
    length: 15
    completed-color: "<green>"
    not-completed-color: "<gray>"

rankup-effects:
  enabled: true
  title:
    enabled: true
    text: "<gradient:#FFD700:#FFA500><bold>¡RANKUP!</bold></gradient>"
    subtitle: "<gray>Ahora eres <white>%rank%"
    fade-in: 10
    stay: 60
    fade-out: 10
  actionbar:
    enabled: true
    text: "<green>✔ Has ascendido a <white>%rank%"
  sound:
    enabled: true
    name: "ENTITY_PLAYER_LEVELUP"
    volume: 1.0
    pitch: 1.0
  particles:
    enabled: true
    name: "TOTEM"
    amount: 40
    offset-x: 0.5
    offset-y: 1.0
    offset-z: 0.5
    speed: 0.1

sounds:
  rankup-success: "ENTITY_PLAYER_LEVELUP"
  rankup-locked: "ENTITY_BAT_TAKEOFF"
  rankup-completed: "ENTITY_ITEM_BREAK"

  prestige-success: "UI_TOAST_CHALLENGE_COMPLETE"
  prestige-locked: "ENTITY_BAT_TAKEOFF"
  prestige-maxed: "ENTITY_ITEM_BREAK"

  rebirth-success: "UI_TOAST_CHALLENGE_COMPLETE"
  rebirth-locked: "ENTITY_BAT_TAKEOFF"
  rebirth-maxed: "ENTITY_ITEM_BREAK"

messages:
  requirements-header: "<red>❌ Te faltan los siguientes requerimientos:"
  requirement-list-format: "&e-> &f%requirement%"

  no-money: "<red>Faltan Fondos: <gray>Requieres <green>$%cost%"
  no-xp: "<red>Falta Experiencia: <gray>Requieres <green>%cost% Niveles"
  no-time: "<red>Falta Tiempo: <gray>Requieres <green>%cost% horas de juego."
  no-mobs: "<red>Faltan Mobs: <gray>Requieres matar <green>%cost% mobs."
  no-players: "<red>Faltan Kills: <gray>Requieres matar <green>%cost% jugadores."
  no-items-entry: "<red>Faltan Items: <gray>%amount%x %item% <dark_gray>(Tienes: %current%)"
  no-items: "<red>Faltan Items: <gray>Revisa los ítems requeridos."

  already-owned: "<red>❌ ¡Ya posees este rango!"
  click-locked: "<red>🔒 ¡Acceso denegado! Completa el rango anterior."

  prestige-disabled: "<red>❌ El sistema de prestige está desactivado."
  prestige-need-max-rank: "<red>❌ Debes alcanzar el rango máximo antes de prestigiar."
  prestige-max-reached: "<red>❌ Ya alcanzaste el prestige máximo."
  no-money-prestige: "<red>❌ Faltan Fondos: <gray>Requieres <green>$%cost% <gray>para prestigiar."
  prestige-success: "<newline><gradient:#d900ff:#7b00ff><bold> PRESTIGE! </bold></gradient> <gray>» <white>%player_name% <gray>ha alcanzado %prestige_display%<newline>"
  maxprestige-summary: "<gradient:#d900ff:#7b00ff>✦ Has ganado <white>%amount%</white> prestige(s)! Ahora eres %prestige_display%</gradient>"
  maxprestige-none: "<red>❌ No puedes prestigiar en este momento."

  rebirth-disabled: "<red>❌ El sistema de rebirth está desactivado."
  rebirth-requirements: "<red>❌ Debes alcanzar el prestige máximo y el rango máximo para renacer."
  rebirth-max-reached: "<red>❌ Ya alcanzaste el rebirth máximo."
  no-money-rebirth: "<red>❌ Faltan Fondos: <gray>Requieres <green>$%cost% <gray>para renacer."
  rebirth-success: "<newline><gradient:#ff0000:#550000><bold> REBIRTH! </bold></gradient> <gray>» <white>%player_name% <gray>ha renacido como %rebirth_display%<newline>"
  maxrebirth-summary: "<gradient:#ff0000:#550000>✦ Has ganado <white>%amount%</white> rebirth(s)! Ahora eres %rebirth_display%</gradient>"
  maxrebirth-none: "<red>❌ No puedes renacer en este momento."

  maxrankup-summary: "<green>✔ Has subido <white>%amount%</white> rango(s)! Ahora eres %rank_display%"
  maxrankup-none: "<red>❌ No puedes ascender de rango en este momento."

  status-completed: "<green><bold>✔ COMPLETADO"
  status-unlocked: "<gray>(Ya desbloqueado)"

  rankup-success: "<newline><gradient:#FFD700:#FFA500><bold> RANKUP! </bold></gradient> <gray>» <white>%player_name% <gray>ha ascendido a %rank%<newline>"

default-rank-display: "<gray>Vagabundo"

locked-item:
  use-original-icon: false
  material: "base64:eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMmRhMTUwOGQ0N2VkNzNiNWM1MTVlM2I5MzkyOGI3MjhlNGJjNjI3ODU2OWE3OWIzNzIzYWI2OTcyY2UwNTM1NyJ9fX0="
  name: "<red>🔒 %rank_display%"
  lore:
    - ""
    - "<gray>Estatus: <red>Bloqueado"
    - "<gray>Requiere completar: <yellow>%req_rank%"
    - ""
    - "<red>No cumples los requisitos aún."

completed-item:
  use-original-icon: false
  material: "base64:eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZDM3ZWVmNDQ4NWJlMGE3MjNhNmE5MDkzOWFjYTE1ZmRlZjIzOWI4YTM5MjY1YzdjODgzNTk4ZDM2YWU1In19fQ=="
  name: "<green>✔ %rank_display%"
  lore:
    - ""
    - "<gray>Estatus: <green>Completado"
    - "<gray>Ya reclamaste y posees los"
    - "<gray>beneficios de este rango."
    - ""
    - "<dark_gray>Rango superado."

prestige-settings:
  enabled: true
  mode: "MAX"
  max-prestige: 10
  base-cost: 50000000
  cost-multiplier: 3.0
  requires-max-rank: true
  reset-rank-on-prestige: true
  display-format: "Prestige %prestige%"
  no-prestige-display: "<gray>Sin Prestige"
  colors-prestiges:
    - "&a"
    - "&b"
    - "&d"
    - "<gradient:#ff0000:#0000ff>"
    - "#FFAA00"
  commands:
    - "broadcast &d&l%player% &5ha alcanzado el %prestige_display%&5!"
  manual-prestiges:
    "1":
      cost: 50000000
    "2":
      cost: 150000000
    "3":
      cost: 400000000
  title:
    enabled: true
    text: "<gradient:#d900ff:#7b00ff><bold>¡PRESTIGE!</bold></gradient>"
    subtitle: "<gray>Ahora eres %prestige_display%"
    fade-in: 10
    stay: 70
    fade-out: 15
  actionbar:
    enabled: true
    text: "<light_purple>✦ Has prestigiado! Ahora eres %prestige_display%"
  sound:
    enabled: true
    name: "ENTITY_ENDER_DRAGON_GROWL"
    volume: 1.0
    pitch: 1.0
  particles:
    enabled: true
    name: "DRAGON_BREATH"
    amount: 60
    offset-x: 0.7
    offset-y: 1.2
    offset-z: 0.7
    speed: 0.15

rebirth-settings:
  enabled: true
  mode: "MAX"
  max-rebirth: 5
  required-prestige: -1
  base-cost: 5000000000
  cost-multiplier: 4.0
  display-format: "Rebirth %rebirth%"
  no-rebirth-display: "<gray>Sin Rebirth"
  colors-rebirths:
    - "&c"
    - "&4"
    - "<gradient:#ff0000:#550000>"
    - "<rainbow>"
  commands:
    - "broadcast &4&l%player% &cha RENACIDO! Ahora es %rebirth_display%&c"
  manual-rebirths:
    "1":
      cost: 5000000000
    "2":
      cost: 20000000000
  title:
    enabled: true
    text: "<gradient:#ff0000:#550000><bold>¡REBIRTH!</bold></gradient>"
    subtitle: "<gray>Ahora eres %rebirth_display%"
    fade-in: 10
    stay: 80
    fade-out: 15
  actionbar:
    enabled: true
    text: "<red>☠ Has renacido! Ahora eres %rebirth_display%"
  sound:
    enabled: true
    name: "ENTITY_WITHER_SPAWN"
    volume: 1.0
    pitch: 1.0
  particles:
    enabled: true
    name: "FLAME"
    amount: 80
    offset-x: 0.8
    offset-y: 1.3
    offset-z: 0.8
    speed: 0.2

