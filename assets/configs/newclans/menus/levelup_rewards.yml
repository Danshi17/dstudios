id: levelup_rewards

title: '<dark_gray>Level Rewards <gray>»</gray> %clan_tag%</dark_gray>'
rows: 6
page-size: 28
open-sound: UI_BUTTON_CLICK

dynamic:
  type: REWARDS
  slots: '10-16,19-25,28-34,37-43'
  material: '%reward_material%'
  name: '<aqua>%reward_name%</aqua>'
  lore:
    - '<gray>Required level: <white>%reward_level%</white></gray>'
    - '<gray>Claimed: <white>%reward_claimed%</white></gray>'
    - ''
    - '<yellow>Click to claim.</yellow>'

items:
  border:
    material: GRAY_STAINED_GLASS_PANE
    name: ' '
    slots: '0-8,9,17,18,26,27,35,36,44,45-53'

  previous:
    slot: 48
    material: ARROW
    name: '<yellow>Previous Page</yellow>'
    action: PAGE_PREVIOUS

  back:
    slot: 49
    material: OAK_DOOR
    name: '<red>Back</red>'
    action: OPEN:levelup_home

  next:
    slot: 50
    material: ARROW
    name: '<yellow>Next Page</yellow>'
    action: PAGE_NEXT
