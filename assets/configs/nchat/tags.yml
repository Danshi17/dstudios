      search-prompt:
        - ""
        - "<gradient:#FF0080:#FF8C00><bold>━━━━━━━━━ BUSCAR TAG ━━━━━━━━━</bold></gradient>"
        - ""
        - "<yellow>Escribe en el chat el nombre o categoría que quieres buscar."
