  panel-not-ready: "%prefix%<red>⚠ El panel de features aún no está listo, intenta de nuevo en unos segundos.</red>"
  gui-manual-use: "%prefix%<red>Este comando no se usa a mano. Escribe [inv], [item] o [ec] en el chat y haz click en el resultado.</red>"
  invalid-preview: "%prefix%<red>Ese vistazo no es válido.</red>"
  preview-not-ready: "%prefix%<red>⚠ Los vistazos del chat aún no están listos.</red>"
  preview-unavailable: "%prefix%<red>Esta función no está disponible.</red>"
  preview-expired: "%prefix%<red>Ese vistazo ya expiró.</red>"
  feature-no-permission: "%prefix%<red>⚠ No tienes permisos para modificar esta feature.</red>"
  feature-toggled: "%prefix%%icon% <white>%feature%</white><gray> ha sido %state%<gray>.</gray>"
  config-missing-tags: "%prefix%<red>Error: Configuración 'menus.tags' no encontrada en tags.yml</red>"
  config-missing-colors: "%prefix%<red>Error: Configuración 'menus.colors' no encontrada en menus.yml</red>"
