        value: ""



#  menus.yml — HubCore - Documentación más explicada por una IA XD
#  Configuración de menús del lobby
#
#  ESTRUCTURA GENERAL DE UN MENÚ:
#
#  <menu-id>:
#    title: "Título del inventario"     # Soporta códigos de color (&a, &l...) y MiniMessage
#    rows: 3                            # Filas del inventario (1–6)
#    update-ticks: 0                    # Cada cuántos ticks se refresca el menú (0 = nunca)
#                                       # Útil para placeholders en tiempo real (ej: jugadores online)
#    auto-detect-servers: false         # Si true, llena slots automáticamente con los servidores
#                                       # del bungee que coincidan con server-prefix
#    server-prefix: "lobby"             # Prefijo para filtrar servidores en auto-detect
#    server-material: GRASS_BLOCK       # Material de los items auto-generados
#    items:
#      <clave-unica>:
#        slot: 0                        # Posición (número o lista de números)
#        material: STONE                # Material del item
#        name: "&aEjemplo"              # Nombre (soporta color y MiniMessage)
#        lore:                          # Descripción del item
#          - "&7Línea 1"
#          - "&7Línea 2"
#
#        # Slot único:
#        slot: 13
#
#        # Múltiples slots (fillers, bordes):
#        slot: [0,1,2,3,4,5,6,7,8]
#
#        # Acción simple:
#        action:
#          type: NONE
#          value: ""
#
#        # Acciones múltiples (se ejecutan en orden):
#        actions:
#          - type: SOUND
#            value: "UI_BUTTON_CLICK"
#          - type: SERVER
#            value: "skywars"
#
# TODOS LOS TIPOS DE ACCIÓN CON EJEMPLOS
#
# NONE
#   No hace nada. Útil para items decorativos o fillers.
#   Ejemplo:
#     action:
#       type: NONE
#       value: ""
#
# MENU
#   Abre otro menú.
#   value: ID del menú definido en este archivo
#   Ejemplo:
#     action:
#       type: MENU
#       value: "tienda"
#
# CLOSE
#   Cierra el menú actual.
#   Ejemplo:
#     action:
#       type: CLOSE
#       value: ""
#
# SERVER
#   Envía al jugador a un servidor BungeeCord.
#   value: nombre del servidor en BungeeCord
#   Ejemplo:
#     action:
#       type: SERVER
#       value: "survival-1"
#
# COMMAND
#   Ejecuta un comando desde la consola.
#   Usa %player% para el nombre del jugador.
#   Ejemplo:
#     action:
#       type: COMMAND
#       value: "give %player% diamond 1"
#
# PLAYER_COMMAND
#   Ejecuta un comando como el jugador.
#   Ejemplo:
#     action:
#       type: PLAYER_COMMAND
#       value: "/spawn"
#
# TELEPORT
#   Teletransporta al spawn configurado en config.yml.
#   Ejemplo:
#     action:
#       type: TELEPORT
#       value: ""
#
# SOUND
#   Reproduce un sonido.
#   Ejemplos comunes:
#     - "UI_BUTTON_CLICK"
#     - "ENTITY_PLAYER_LEVELUP"
#     - "BLOCK_ANVIL_BREAK"
#     - "ENTITY_EXPERIENCE_ORB_PICKUP"
#   Ejemplo:
#     action:
#       type: SOUND
#       value: "UI_BUTTON_CLICK"
#
# MESSAGE
#   Envía un mensaje al chat del jugador.
#   Soporta colores y PlaceholderAPI.
#   Ejemplo:
#     action:
#       type: MESSAGE
#       value: "&a¡Hola &e%player_name%&a!"
#
# TITLE
#   Muestra un título en pantalla.
#   Combinar con SUBTITLE usando actions para mostrar ambos.
#   Ejemplo:
#     actions:
#       - type: TITLE
#         value: "&6&lBIENVENIDO"
#       - type: SUBTITLE
#         value: "&7al servidor"
#
# SUBTITLE
#   Muestra un subtítulo en pantalla.
#   Debe usarse junto con TITLE.
#   Ejemplo:
#     actions:
#       - type: TITLE
#         value: "&6Título"
#       - type: SUBTITLE
#         value: "&7Subtítulo"
#
# ACTIONBAR
#   Muestra un mensaje en la barra de acción (sobre la hotbar).
#   Soporta colores y PlaceholderAPI.
#   Ejemplo:
#     action:
#       type: ACTIONBAR
#       value: "&b¡Hola %player_name%!"
#
# RESET_TAG
#   Elimina el tag personalizado del jugador.
#   Ejemplo:
#     action:
#       type: RESET_TAG
#       value: ""
#
# RESET_CHATCOLOR
#   Elimina el color de chat del jugador.
#   Ejemplo:
#     action:
#       type: RESET_CHATCOLOR
#       value: ""
#
# EJEMPLOS DE ACCIONES COMBINADAS
#
# Unirse a un servidor con sonido:
#   actions:
#     - type: SOUND
#       value: "UI_BUTTON_CLICK"
#     - type: SERVER
#       value: "minijuegos"
#
# Título completo con sonido:
#   actions:
#     - type: TITLE
#       value: "&c&lPVP ARENA"
#     - type: SUBTITLE
#       value: "&7Prepárate"
#     - type: SOUND
#       value: "ENTITY_WITHER_SPAWN"
#
# Recompensa diaria:
#   actions:
#     - type: SOUND
#       value: "ENTITY_PLAYER_LEVELUP"
#     - type: MESSAGE
#       value: "&a¡Recompensa reclamada!"
#     - type: COMMAND
#       value: "give %player% diamond 5"
#     - type: ACTIONBAR
#       value: "&a+5 Diamantes"
#     - type: CLOSE
#       value: ""
#
# ITEMS COSMÉTICOS (TAGS Y COLORES DE CHAT)
#
# Tags:
#   tag-value: "&6[VIP]"           # Tag que se mostrará
#   permission: "hubcore.tag.vip"  # Permiso requerido
#   price: 100                     # Precio (opcional)
#   price-type: "VAULT"            # VAULT o POINTS
#
#   Ejemplo:
#     tag_vip:
#       slot: 20
#       material: GOLD_INGOT
#       name: "&6&lTag VIP"
#       tag-value: "&6[VIP]"
#       permission: "hubcore.tag.vip"
#       price: 100
#       actions:
#         - type: SOUND
#           value: "ENTITY_EXPERIENCE_ORB_PICKUP"
#
# Colores de chat:
#   color-code: "&a"               # Código de color
#   permission: "hubcore.color.green"
#   price: 50
#
#   Ejemplo:
#     color_green:
#       slot: 22
#       material: GREEN_DYE
#       name: "&a&lColor Verde"
#       color-code: "&a"
#       permission: "hubcore.color.green"
#       actions:
#         - type: SOUND
#           value: "UI_BUTTON_CLICK"
#
# PLACEHOLDERS SOPORTADOS (PlaceholderAPI)
#
# %player_name%          → Nombre del jugador
# %player_displayname%   → Nombre mostrado
# %player_uuid%          → UUID
# %player_ping%          → Ping
# %player_health%        → Salud actual
# %player_food_level%    → Nivel de comida
# %luckperms_prefix%     → Prefijo de rango
# %vault_eco_balance%    → Balance económico
# %server_online%        → Jugadores online
# %server_tps%           → TPS del servidor
#
# NOTAS
#
# - update-ticks actualiza placeholders en tiempo real
# - auto-detect-servers genera items automáticamente por cada servidor
# - Los sonidos funcionan con nombres de Bukkit y XSound
# - Los comandos COMMAND usan permisos de consola
# - Los comandos PLAYER_COMMAND usan permisos del jugador
# - %player% funciona en comandos y mensajes
#