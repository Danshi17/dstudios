menus:
  nick-colors:
    messages:
      no-permission: "<red>⚠ <gray>No tienes permiso para usar este color de nick."
      success: "<green>✔ <gray>¡El color de tu nombre ha sido actualizado!"
      reset: "<yellow>✔ <gray>El color de tu nick ha sido restablecido al valor por defecto."

    title: "<gradient:#00ffcc:#0055ff><bold>Colores de Nick: %player_name% (Pág. %page%)</bold></gradient>"
    rows: 6

    filler:
      enabled: false
      material: "BLACK_STAINED_GLASS_PANE"
      name: " "
      lore: []

    items:

      #                        PÁGINA 1
      color_black:
        page: 1
        slot: 0
        material: "BLACK_WOOL"
        name: "<black>Negro"
        lore:
