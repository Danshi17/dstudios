id: members
title: '<dark_gray>Members <gray>»</gray> %clan_tag%</dark_gray>'
rows: 6
page-size: 28
open-sound: UI_BUTTON_CLICK

dynamic:
  type: MEMBERS
  slots: '10-16,19-25,28-34,37-43'
  material: PLAYER_HEAD
  head-owner: '%member_head_owner%'
  texture: '%member_texture%'
  name: '<green>%member_name%</green>'
  lore:
    - '<gray>Role: <white>%member_role%</white></gray>'
    - '<gray>Nickname: <white>%member_nickname%</white></gray>'
    - '<gray>Kills: <white>%member_kills%</white></gray>'
    - '<gray>Deaths: <white>%member_deaths%</white></gray>'
    - '<gray>KDR: <white>%member_kdr%</white></gray>'
    - '<gray>Souls: <white>%member_souls%</white></gray>'
    - '<gray>Online: <white>%member_online%</white></gray>'
    - ''
    - '<yellow>Left-click: profile</yellow>'
    - '<green>Shift-left: promote</green>'
    - '<gold>Shift-right: demote</gold>'
    - '<aqua>Middle-click: transfer leader</aqua>'
    - '<red>Right-click: kick</red>'

items:
  border:
    material: GRAY_STAINED_GLASS_PANE
    name: ' '
    slots: '0-8,9,17,18,26,27,35,36,44,45-53'

  invite:
    slot: 47
    material: LIME_DYE
    name: '<green>Invite Member</green>'
    lore:
      - '<gray>Use <white>/clan invite <player></white></gray>'
    action: CLOSE

  previous:
    slot: 48
    material: ARROW
    name: '<yellow>Previous Page</yellow>'
    action: PAGE_PREVIOUS

  back:
    slot: 49
    material: OAK_DOOR
    name: '<red>Back</red>'
    action: OPEN:clan_home

  next:
    slot: 50
    material: ARROW
    name: '<yellow>Next Page</yellow>'
    action: PAGE_NEXT

  online:
    slot: 51
    material: CLOCK
    name: '<aqua>Online: <white>%clan_online%</white></aqua>'
    lore:
      - '<gray>Total: <white>%clan_members%/%clan_member_limit%</white></gray>'
