# =========================================
# PrisonBattlePass - config.yml
# =========================================

# Idioma por defecto (EN / ES)
default-lang: ES

# Temporada actual
season:
  name: "Temporada 1"
  start: "2026-06-29"
  end: "2026-09-01"
  bonus-xp-per-1000-blocks: 1

max-level: 50
xp-per-level: 100

weeks:
  total: 6
  days-per-week: 7

rubycoins:
  enabled: true
  economy-id: "rubys"

# Notificacion general por defecto cuando se completa cualquier quest
quest-complete-defaults:
  title: "&a&l¡QUEST COMPLETADA!"
  subtitle: "&7%quest% &7(+&e%xp% XP&7)"
  actionbar: "&a&l✔ &7Completaste: &e%quest% &7(+&e%xp% XP&7)"
  sound: "ENTITY_PLAYER_LEVELUP"
  sound-volume: 1.0
  sound-pitch: 1.2

gui:
  main:
    size: 54
    title-free: "&6&lBattle Pass"
    title-rewards: "&6&lBattle Pass &8(Rewards)"
    title-quests: "&6&lBattle Pass &8(Quests)"
    info-item:
      slot: 22
      material: "ANVIL"
      name: "&6&lPremium Battle Pass"
      lore:
        - "&7| &fLevel: &e%level%"
        - "&7| &fXp: &e%xp%&7/&e%xp_needed%"
        - "&7| &fSemana actual: &e%week%"
    quests-item:
      slot: 11
      material: "ENCHANTED_BOOK"
      name: "&e&lQuests"
      lore:
        - "&7Complete weekly and daily quests"
        - "&7to progress through the &6Battle Pass&7."
        - ""
        - "&e<< Click to view the quests >>"
    rewards-item:
      slot: 15
      material: "CHEST_MINECART"
      name: "&e&lRewards"
      lore:
        - "&7By completing quests you can claim"
        - "&7many different &6OP rewards&7."
        - ""
        - "&e<< Click to view the rewards >>"
    bonus-xp-item:
      slot: 20
      material: "EMERALD"
      name: "&a&lBonus XP"
      lore:
        - "&7Every &e1000 blocks &7you break, you gain"
        - "&a1 XP &7to boost your Battle Pass!"
    what-item:
      slot: 24
      material: "BOOK"
      name: "&c&lWhat is the Battle Pass?"
      lore:
        - ""
        - "&7Level up your &cBattle Pass &7by"
        - "&7gaining &axp &7from completing quests"
        - ""
        - "&7You can purchase the &dpremium pass"
        - "&7for an enhanced experience in &f/store"
    back-item:
      material: "ARROW"
      name: "&cVolver"
      lore:
        - "&7Click para volver al menu anterior."
    filler:
      material: "BLACK_STAINED_GLASS_PANE"
      name: " "

  rewards:
    size: 54              # Tamaño del menú de recompensas
    title: "&6&lBattle Pass &8(Rewards - Pg %page%/%max_pages%)"

    columns: 7

    start-slot-premium: 10
    start-slot-indicator: 19
    start-slot-free: 28

    previous-page-item:
      material: "ARROW"
      slot: 47
      name: "&a&l« Página Anterior (%prev_page%/%max_pages%)"
      lore:
        - "&7Click para ir a la página anterior."
    next-page-item:
      material: "ARROW"
      slot: 51
      name: "&a&lPágina Siguiente (%next_page%/%max_pages%) »"
      lore:
        - "&7Click para ir a la página siguiente."
    back-item:
      material: "ARROW"
      slot: 49
      name: "&cVolver"
      lore:
        - "&7Click para volver al menú anterior."

    indicator:
      unlocked:
        material: "LIME_STAINED_GLASS_PANE"
        name: "&a&lLevel %level%"
        lore:
          - ""
          - "&fInformation"
          - "&7| Status: &aUnlocked"
      locked:
        material: "RED_STAINED_GLASS_PANE"
        name: "&c&lLevel %level%"
        lore:
          - ""
          - "&cInformation"
          - "&7| Status: &cLocked"

    locked-item:
      material: "BARRIER"
      name: "&c&lBloqueado (Nivel %level%)"
      lore:
        - "&7Completa quests para desbloquear."
    claimed-item:
      material: "GREEN_STAINED_GLASS_PANE"
      name: "&a&lYa reclamado"
      lore: []

  quests:
    size: 54              # Tamaño del menú de lista de semanas
    week-slots: [10, 11, 12, 13, 14, 15, 16]
    daily-slot: 4
    week-item:
      material: "WRITABLE_BOOK"
      name: "&e&lWeek %week%"
      lore-unlocked:
        - "&7Every week &anew quests &7are released."
        - ""
        - "&eInformation"
        - "&7| &fCompleted Quests: &e%completed%&7/&e%total%"
        - ""
        - "&e<< Click to view the quests >>"
      lore-locked:
        - "&7Every week &anew quests &7are released."
        - ""
        - "&eInformation"
        - "&7| &cReleases in: &f%time_left%"
    daily-item:
      material: "CLOCK"
      name: "&e&lDaily Quests"
      lore:
        - "&7Every 24 hours &anew quests &7are released"
        - "&7for you to gain some extra xp."
        - ""
        - "&eInformation"
        - "&7| &fNew Quests in: &e%time_left%"
    back-item:
      slot: 49
      material: "ARROW"
      name: "&cVolver"
      lore:
        - "&7Click para volver al menú principal."

  week-quests:
    size: 54              # Tamaño del menú de misiones de una semana
    quest-slots: [19, 20, 21, 22, 23, 24, 25]
    back-item:
      slot: 49
      material: "ARROW"
      name: "&cVolver a semanas"
      lore:
        - "&7Click para volver a la lista de semanas."

  daily-quests:
    size: 54              # Tamaño del menú de misiones diarias
    quest-slots: [19, 20, 21, 22, 23, 24, 25]
    back-item:
      slot: 49
      material: "ARROW"
      name: "&cVolver a menú principal"
      lore:
        - "&7Click para volver al Battle Pass."

levels:
  1:
    free:
      item:
        material: "GOLD_INGOT"
        name: "&eLevel 1 &7(Free)"
        lore:
          - "&aInformation"
          - "&7| Type: &aFree Reward"
          - ""
          - "&aRewards"
          - "&7| &f5x Gold Ingot"
          - ""
          - "&e<< Click to claim the reward >>"
