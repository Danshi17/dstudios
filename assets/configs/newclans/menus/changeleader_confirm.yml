id: changeleader_confirm
title: '<dark_red>Transfer Leadership</dark_red>'
rows: 3
open-sound: BLOCK_ANVIL_LAND

items:
  border:
    material: BLACK_STAINED_GLASS_PANE
    name: ' '
    slots: '0-26'
  target:
    slot: 13
    material: PLAYER_HEAD
    head-owner: '%target_uuid%'
    name: '<yellow>New Leader: <white>%target_name%</white></yellow>'
    lore:
      - '<gray>This will transfer clan ownership.</gray>'
  confirm:
    slot: 11
    material: LIME_CONCRETE
    name: '<green>Confirm</green>'
    action: COMMAND:clan leader %target_name%
  cancel:
    slot: 15
    material: RED_CONCRETE
    name: '<red>Cancel</red>'
    action: OPEN:members
