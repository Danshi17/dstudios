      help:
        enabled: true
        slot: 49
        material: BOOK
        name: '<gradient:#ffd65f:#f0a51b><bold>GUÍA DE TRABAJOS</bold></gradient>'
        lore:
          - ''
          - '&fTrabaja, gana dinero, sube de nivel,'
          - '&fcompleta misiones y firma contratos.'
          - ''
          - '&#00f2fe✔ ¡Click para consultar!'
