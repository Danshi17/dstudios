# NewSkills rewards - cada habilidad tiene premios completamente editables.
# Las recompensas se reclaman manualmente desde /skills -> habilidad -> rewards.
# Si settings.auto-claim = true, se entregan automáticamente al subir nivel.
# money usa Vault; commands acepta [console], [player] y [message].
# Variables: {player}, {uuid}, {skill}, {skill_upper}, {level}, {reward_level},
# {prestige}, {prestige_next}, {prestige_required}, {prestige_cost}.
# Cada rewards.<nivel> puede configurar `click-sound` para sustituir el sonido
# de menus.rewards.levels.<estado> sin afectar al resto de recompensas.
# Ejemplo: click-sound: { enabled: true, type: 'my_pack:ui.reward', volume: 0.8, pitch: 1.0 }
# La recompensa se marca como reclamada ANTES de ejecutar comandos (protección contra duplicación).
# prestige.requirement: last-reward, skill-cap o level. Los datos se guardan en rewards-data.yml.
# Máximo de prestigios: 0 = ilimitados. prestige.commands son comandos de consola sin barra.
# Las habilidades derivadas pueden reclamar premios de su nivel calculado, pero no prestigiar.

settings:
  enabled: true
  auto-claim: false
prestige:
  enabled: true
  # payment-mode: vault descuenta directamente; command usa withdraw-command y verifica
  # con Vault que se descontó la cantidad configurada (no acepta comandos falsos).
  payment-mode: vault
  withdraw-command: 'eco take {player} {prestige_cost}'
  requirement: last-reward
  required-level: 100
  # El requisito efectivo siempre será al menos el nivel 100.
  cost: 10000
  cost-increase: 5000
  max: 0
  reset-level: 0
  require-claimed-rewards: false
  commands: []
messages:
  locked: '&cDebes alcanzar el nivel &e{reward_level}&c de {skill} para reclamar el premio.'
  claimed: '&eYa reclamaste esa recompensa.'
  received: '&a¡Recompensa del nivel &e{reward_level}&a de {skill} recibida!'
  no-economy: '&cSe necesita Vault con un proveedor de economía disponible.'
  storage-error: '&cNo se pudo guardar el progreso de recompensas. Contacta a un administrador.'
  payment-error: '&cError al procesar la recompensa o el pago. Contacta a un administrador.'
  require-level: '&cPara hacer prestigio necesitas llegar al nivel &e{prestige_required}&c.'
  max-prestige: '&cYa alcanzaste el límite de prestigios.'
  claim-first: '&cReclama todas las recompensas antes de hacer prestigio.'
  not-enough-money: '&cNo tienes suficiente dinero. Necesitas &a${prestige_cost}&c.'
  prestiged: '&a¡Prestigio completado! Ahora tienes prestigio &b{prestige}&a en {skill}.'
