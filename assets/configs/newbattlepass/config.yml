          - "&aInformation"
          - "&7| Type: &dPremium Reward"
          - ""
          - "&aRewards"
          - "&7| &a2x Emerald"
          - ""
          - "&e<< Click to claim the reward >>"
      commands:
        - "give %player% emerald 2"

  3:
    free:
      item:
        material: "EXPERIENCE_BOTTLE"
        name: "&6Level 3 &7(Free)"
        lore:
          - "&aInformation"
          - "&7| Type: &aFree Reward"
