settings:
  enabled: true
  snapshot-expire-seconds: 300

item:
  enabled: true
  triggers:
    - "[item]"
    - "[i]"
  permission: "nchat.chat.item"
  display: "<gray>[<yellow>%item%</yellow> &fde %player_name%<gray>]</gray>"
  hover: "<gray>Click para ver el item (<yellow>%item%</yellow> x%amount%) que tiene %player_name% en la mano"
  title: "<dark_gray>Item de %player_name%"
  type: DISPENSER
  rows: 3
  static-items:
    held:
      slot: 4
      source: HELD
      empty-material: BARRIER
      empty-name: "<red>Sin item en mano"
      empty-lore:
        - "<gray>El jugador no tiene nada en la mano."
  filler:
    enabled: true
    material: GRAY_STAINED_GLASS_PANE
    name: " "
    lore: []
    slots: "0,1,2,3,5,6,7,8"

