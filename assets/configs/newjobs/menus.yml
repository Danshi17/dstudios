        enabled: true
        slot: 48
        material: PLAYER_HEAD
        skull-owner: '{player}'
        name: '<gradient:#00f2fe:#4facfe><bold>PERFIL DE {player}</bold></gradient>'
        lore:
          - ''
          - '&8▪ &fTrabajos activos: &b{joined_jobs}&7/&#00f2fe{max_jobs}'
          - '&8▪ &fNivel global: &e{total_level}'
          - ''
          - '&#00f2fe✔ ¡Sigue progresando!'
