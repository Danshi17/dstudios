#                   ItemsRPG - items.yml
# Configuración de todos los items del plugin.
#
# TIPOS DE ITEMS:
#   CONSUMABLE          - Se consume al usarse (1 uso)
#   INFINITE_CONSUMABLE - No se consume, tiene cooldown
#   VANILLA_COOLDOWN    - Item vanilla con cooldown personalizado
#   DECORATIVE          - Solo decorativo/tradeo, sin acciones
#   RPG_CUSTOM          - Solo para items builtin (SpiderWebItem, etc.)
#
# FORMATOS DE COLOR SOPORTADOS:
#   Legacy:      &a, &b, &l, &r, &6Texto, etc.
#   Hexadecimal: &#RRGGBB o {#RRGGBB}
#   MiniMessage: <red>, <bold>, <gradient:#ff0000:#0000ff>texto</gradient>
#   Adventure:   <rainbow>texto</rainbow>
#
# MATERIALES:
#   Normal: DIAMOND_SWORD, BLAZE_ROD, etc. (XMaterial)
#   HDB:    hdb-7129 (requiere HeadDatabase instalado)
#
# EFECTOS DE POCIÓN: "NOMBRE:duracion_seg:nivel"
#   Ejemplo: "REGENERATION:10:2" = Regeneración 10s nivel 2
#
# SONIDOS: "NOMBRE_SONIDO:volumen:pitch"
#   Ejemplo: "ENTITY_PLAYER_BURP:1.0:1.0"
#
# PARTÍCULAS: "NOMBRE_PARTICULA:cantidad"
#   Ejemplo: "HEART:10"
#
# PROPIEDADES COMUNES:
#   enabled: true/false           - Habilita/deshabilita el item
#   material: MATERIAL            - Material del item
#   name: "Nombre"                - Nombre con colores
#   lore: []                      - Lista de descripciones
#   amount: 1                     - Cantidad por defecto
#   glowing: false                - Brillo de encantamiento
#   hide-flags: false             - Oculta atributos/enchants
#   unbreakable: false            - Hace el item irrompible
#   custom-model-data: -1         - Modelo personalizado
#   enchantments: {}              - Encantamientos del item
#   potion-effects: []            - Efectos de poción en el item
#   messages: []                  - Mensajes al usar
#   effects: []                   - Efectos de poción al usar
#   sounds: []                    - Sonidos al usar
#   particles: []                 - Partículas al usar
#   cooldown: 0                   - Cooldown en segundos
# ============================================================

