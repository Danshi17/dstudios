      - "&7Bloquear zonas públicas o abusar de las protecciones."
    levels:
      1: { summary: "&aWarn", commands: ["litebans:warn %player% Abuso de Claims [%modality%]"] }
      2: { summary: "&eTempban 3d", commands: ["litebans:tempban %player% 3d Abuso de Claims [%modality%]"] }
      3: { summary: "&cTempban 7d", commands: ["litebans:tempban %player% 7d Abuso de Claims [%modality%]"] }

  estafa:
    modalities: [ALL]
    material: "EMERALD"
    name: "&6&lEstafa a Jugadores"
