name: nChat
version: '0.1-SNAPSHOT'
main: org.dev.danshi.nChat.NChat
api-version: '1.13'
softdepend: [PlaceholderAPI, HeadDatabase]
authors: [Danshi_]
description: Advanced chat plugin with visual components, hex gradients, Nick Colors and GUI support.

commands:
  nchat:
    description: Comando principal del plugin (Reload).
    usage: "/nchat reload | /nchat tagsimport [carpeta]"
    aliases: [nc]
  clearchat:
    description: Borra el chat global.
    usage: /clearchat
    aliases: [cc]
  chatlock:
    description: Bloquea o desbloquea el chat global.
    usage: /chatlock
    aliases: [togglechat, lockchat]
  color:
    description: Abre el menú de selección de colores y gradientes para el CHAT.
    usage: /color
    aliases: [colors, chatcolor, ccolor]
  nickc:
    description: Abre el menú de selección de colores para el NICK (Nombre).
    usage: /nickc
    aliases: [nickcolor, ncolor, nicknamecolor]
  nchatgui:
    description: Comando interno para abrir los inventarios compartidos en el chat.
    usage: /nchatgui <tipo> <id> [pagina]
  nchatpanel:
    description: Abre el panel de administración para activar/desactivar las features del core.
    usage: /nchatpanel
    aliases: [ncp, panel, features]
  msg:
    description: Envía un mensaje privado a un jugador.
    usage: /msg <jugador> <mensaje>
    aliases: [tell, w, whisper, pm]
  r:
    description: Responde al último jugador que te escribió o al que le escribiste.
    usage: /r <mensaje>
    aliases: [reply]
  msgspy:
    description: Activa o desactiva la vista de los mensajes privados de los jugadores.
    usage: /msgspy
    aliases: [socialspy, spy]
  msgtoggle:
    description: Activa o desactiva que te envíen mensajes privados.
    usage: /msgtoggle
    aliases: [dm, togglepm, receivepm]
  ignore:
    description: Ignora a un jugador para no recibir sus mensajes privados.
    usage: /ignore <jugador>
    aliases: [block]
  unignore:
    description: Deja de ignorar a un jugador.
    usage: /unignore <jugador>
    aliases: [unblock]
  ignorelist:
    description: Muestra tu lista de jugadores ignorados.
    usage: /ignorelist
    aliases: [ignores, blockedlist]
  adivinar:
    description: Adivina el número o la palabra del evento activo.
    usage: /adivinar <número o palabra>
  chatevent:
    description: Inicia, detiene o consulta los eventos de chat (adivinar y GG).
    usage: /chatevent <adivinar|gg> <start|stop|status> [number|word]
    aliases: [cevent]

permissions:

  nchat.admin:
    description: Permiso general de administrador (Bypass de todo).
    default: op
  nchat.reload:
    description: Permiso para recargar la configuración y menús.
    default: op
  nchat.tagsimport:
    description: Permite importar tags desde una carpeta de SupremeTags.
    default: op
  nchat.clearchat:
    description: Permiso para limpiar el chat.
    default: op
  nchat.toggle:
    description: Permiso para bloquear/desbloquear el chat.
    default: op
  nchat.tags.menu:
    description: Permite abrir el menú de tags.
    default: true

  nchat.features.menu:
    description: Permite abrir el panel de administración y activar/desactivar features del core.
    default: op

  nchat.adivinar:
    description: Permite participar en el evento /adivinar.
    default: true
  nchat.events.manage:
    description: Permite iniciar, detener y consultar los eventos de chat con /chatevent.
    default: op

  nchat.msg:
    description: Permite usar /msg y /r.
    default: true
  nchat.msg.vanished:
    description: Permite enviar mensajes privados a jugadores en vanish.
    default: op
  nchat.msgspy:
    description: Permite usar /msgspy y ver los mensajes privados de otros jugadores.
    default: op
  nchat.msgspy.exempt:
    description: Los mensajes privados de este jugador no aparecen en el msgspy.
    default: false
  nchat.msg.bypass.dm:
    description: Permite enviar /msg aunque el destino tenga los mensajes desactivados.
    default: op
  nchat.msg.bypass.ignore:
    description: Permite enviar /msg aunque el destino te tenga ignorado.
    default: op

  nchat.bypass.lock:
    description: Permite escribir cuando el chat está bloqueado.
    default: op
  nchat.bypass.cooldown:
    description: Permite hablar rápido sin esperar los segundos configurados.
    default: op
  nchat.bypass.filter:
    description: Permite decir palabras prohibidas sin ser castigado.
    default: op
  nchat.bypass.commands:
    description: Permite usar comandos bloqueados (/plugins, etc).
    default: op
  nchat.bypass.tab:
    description: Permite ver todos los comandos en el TAB completado.
    default: op

  nchat.customtag:
    description: Permiso base para usar el sistema de tags personalizadas.
    default: true
  nchat.customtag.plus:
    description: Límite de tags personalizadas - Plus (10 tags).
    default: false
  nchat.customtag.vip:
