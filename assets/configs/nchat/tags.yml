          - "<gray>Exclusivo para rangos VIP."
          - "<yellow>Click para equipar."
        tag: "<gradient:gold:yellow>[<bold>VIP</bold>]</gradient> "
        permission: "nchat.tag.vip"
        category: "VIP"
        locked:
          material: "BARRIER"
          name: "<red><strikethrough>Tag VIP"
          lore:
            - "<gray>Requiere rango <gold>VIP</gold>"
            - "<gray>para desbloquear."

