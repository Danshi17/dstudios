    levels:
      1: { summary: "&aTempban 7d", commands: ["litebans:tempban %player% 7d Estafa a jugadores [%modality%]"] }
      2: { summary: "&eTempban 15d", commands: ["litebans:tempban %player% 15d Estafa a jugadores [%modality%]"] }
      3: { summary: "&cTempban 30d", commands: ["litebans:tempban %player% 30d Estafa a jugadores [%modality%]"] }

  kill_boosting:
    modalities: [ALL]
    material: "TOTEM_OF_UNDYING"
