name: NewPets
version: '${version}'

main: me.danshi.newPets.NewPets
api-version: '1.18'
load: POSTWORLD
depend: [PinnaPrison]
softdepend: [PlaceholderAPI, HeadDatabase, Essentials]

commands:
  pets:
    description: Abre el menú de mascotas
    aliases: [pet, mascotas, mascota]
    usage: /pets
  petsadmin:
    description: Administración de mascotas
    usage: /petsadmin <subcomando>

permissions:
  newpets.use:
    description: Usar el menú de mascotas
    default: true
  newpets.admin:
    description: Comandos admin
    default: op
  newpets.egg.give:
    description: Dar huevos
    default: op