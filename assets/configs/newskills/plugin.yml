name: NewSkills
version: ${project.version}
description: >
    NewSkills: habilidades, experiencia, GUI editable, Base64 y MiniMessage.

author: dStudios

main: github.dstudio.newskills.NewSkills
softdepend: [ WorldGuard, CombatTag, HealthBar, PlaceholderAPI, ViaVersion, Vault ]
load: POSTWORLD
folia-supported: true
api-version: 1.18
# Downloaded by Paper/Spigot's JavaPluginLoader, not bundled in NewSkills.jar.
# Keep their versions in sync with the provided dependencies in pom.xml.
libraries:
    - org.apache.tomcat:tomcat-jdbc:11.0.14
    - org.apache.tomcat:tomcat-juli:11.0.14
    - com.mysql:mysql-connector-j:9.5.0
    - com.h2database:h2:2.2.224
    - com.zaxxer:HikariCP:5.1.0
    - org.mongodb:bson:4.11.1
    - org.mongodb:mongodb-driver-core:4.11.1
    - org.mongodb:mongodb-driver-sync:4.11.1
    - org.slf4j:slf4j-api:2.0.9

commands:
    mmoxpbar:
        aliases: xpbarsettings
        description: Change XP bar settings
    mmodebug:
        aliases: [ newskillsdebugmode ]
        description: Toggles a debug mode which will print useful information to chat
    mmoinfo:
        aliases: [ mcinfo ]
        description: Info pages for NewSkills
        permission: newskills.commands.mmoinfo
    xprate:
        aliases: [ mcxprate ]
        description: View or modify the xp rate or start an event
        permission: newskills.commands.xprate
    newskills:
        aliases: [mcmmo]
        description: Opens the NewSkills GUI; /mcmmo is an alias
        permission: newskills.use
    skills:
        description: Opens the configurable skill overview; /skills reload for staff
        permission: newskills.use
    mctop:
        description: Show NewSkills leader boards
        permission: newskills.commands.mctop
    mcrank:
        description: Show NewSkills ranking for a player
        permission: newskills.commands.mcrank
    addxp:
        description: Add NewSkills XP to a user
        permission: newskills.commands.addxp
    addlevels:
        description: Add NewSkills levels to a user
        permission: newskills.commands.addlevels
    mcability:
        description: Toggle whether abilities get readied on right click
        permission: newskills.commands.mcability
    mcrefresh:
        description: Refresh all cooldowns for NewSkills
        permission: newskills.commands.mcrefresh
    mccooldown:
        description: Show the cooldowns on all your NewSkills abilities
        aliases: [ mccooldowns ]
        permission: newskills.commands.mccooldown
    mcchatspy:
        description: Toggle NewSkills Party Chat spying on/off
        permission: newskills.commands.mcchatspy
    mcgod:
        description: Toggle NewSkills god-mode on/off
        permission: newskills.commands.mcgod
    mcstats:
        aliases: [ stats ]
        description: Shows your NewSkills stats and xp
        permission: newskills.commands.mcstats
    mcremove:
        description: Remove a user from the database
        permission: newskills.commands.mcremove
    mmoedit:
        description: Edit the NewSkills skill values for a user
        permission: newskills.commands.mmoedit
    ptp:
        description: Teleport to a party member
        permission: newskills.commands.ptp
    party:
        description: Create/join a party
        permission: newskills.commands.party
    inspect:
        aliases: [ mcinspect, mmoinspect ]
        description: View detailed NewSkills info on another player
        permission: newskills.commands.inspect
    mmoshowdb:
        description: Show the name of the current database type (for later use with /mmoupdate)
        permission: newskills.commands.mmoshowdb
    mcconvert:
        description: Convert between different database and formula types
        permission: newskills.commands.mcconvert
    partychat:
        aliases: [ pc, p ]
        description: Toggle Party chat or send party chat messages
        permission: newskills.chat.partychat
    skillreset:
        description: Reset the level of one or all of your skills
        permission: newskills.commands.skillreset
    excavation:
        description: Detailed NewSkills skill info
        permission: newskills.commands.excavation
    herbalism:
        description: Detailed NewSkills skill info
        permission: newskills.commands.herbalism
    mining:
        description: Detailed NewSkills skill info
        permission: newskills.commands.mining
    woodcutting:
        description: Detailed NewSkills skill info
        permission: newskills.commands.woodcutting
    axes:
        description: Detailed NewSkills skill info
        permission: newskills.commands.axes
    archery:
        description: Detailed NewSkills skill info
        permission: newskills.commands.archery
    crossbows:
        description: Detailed NewSkills skill info
        permission: newskills.commands.crossbows
    swords:
        description: Detailed NewSkills skill info
        permission: newskills.commands.swords
    taming:
        description: Detailed NewSkills skill info
        permission: newskills.commands.taming
    tridents:
        description: Detailed NewSkills skill info
        permission: newskills.commands.tridents
    unarmed:
        description: Detailed NewSkills skill info
        permission: newskills.commands.unarmed
    acrobatics:
        description: Detailed NewSkills skill info
        permission: newskills.commands.acrobatics
    repair:
        description: Detailed NewSkills skill info
        permission: newskills.commands.repair
    fishing:
        description: Detailed NewSkills skill info
        permission: newskills.commands.fishing
    smelting:
        description: Detailed NewSkills skill info
        permission: newskills.commands.smelting
    spears:
        description: Detailed NewSkills skill info
        permission: newskills.commands.spears
    alchemy:
        description: Detailed NewSkills skill info
        permission: newskills.commands.alchemy
    salvage:
        description: Detailed NewSkills skill info
        permission: newskills.commands.salvage
    maces:
        description: Detailed NewSkills skill info
        permission: newskills.commands.maces
    mmopower:
        description: Shows skill mastery and power level info
        permission: newskills.commands.mmopower
        aliases: [ mmopowerlevel, powerlevel ]
    adminchat:
        aliases: [ ac, a ]
        description: Toggle Admin chat or send admin chat messages
        permission: newskills.chat.adminchat
    mcpurge:
        description: Purge users with 0 powerlevel and/or who haven't connected in several months from the server DB.
        permission: newskills.commands.mcpurge
    mcnotify:
        aliases: [ notify ]
        description: Toggle NewSkills abilities chat display notifications on/off
        permission: newskills.commands.mcnotify
    mclevelupsound:
        aliases: [ levelupsound ]
        description: Toggle the NewSkills level-up sound on/off
        permission: newskills.commands.mclevelupsound
    mcscoreboard:
        aliases: [ mcsb ]
        description: Manage your NewSkills Scoreboard
        permission: newskills.commands.mcscoreboard
    newskillsreloadlocale:
        aliases: [ mcreloadlocale ]
        description: Reloads locale
        permission: newskills.commands.reloadlocale
permissions:
    #newskills.defaults is the intended default permission, give this to your players for the intended experience
    newskills.defaults:
        default: true
        description: newskills permisions that default to true
        children:
            newskills.chat.partychat: true
            newskills.commands.defaults: true
            newskills.motd: true
            newskills.skills.all: true
            newskills.chat.colors: true
            newskills.broadcast.levelup: true
    newskills.defaultsop:
        default: op
        description: newskills permissions that default to op
        children:
            newskills.chat.adminchat: true
            newskills.commands.defaultsop: true
            newskills.item.all: true
            newskills.tools.all: true
    newskills.*:
        default: false
        description: Implies all newskills permissions.
        children:
            newskills.all: true
    newskills.all:
        default: false
        description: Implies all newskills permissions.
        children:
            newskills.admin: true
            newskills.engine.admin: true
            newskills.bypass.all: true
            newskills.commands.all: true
            newskills.defaults: true
            newskills.defaultsop: true
            newskills.party.all: true
            newskills.perks.all: true
    newskills.broadcast.levelup:
        description: when the player reaches certain level milestones their achievement will be broadcast in chat to other plays
    newskills.ability.*:
        default: false
        description: Implies all newskills.ability permissions.
        children:
            newskills.ability.all: true
    newskills.ability.all:
        default: false
        description: Implies all newskills.ability permissions.
