settings:
  enabled: true
  default-no-tag: "&8[&7Jugador&8]"

database:
  type: SQLITE

  sqlite: {}

  h2: {}

  mysql:
    host: localhost
    port: 3306
    database: minecraft
    username: root
    password: "********"
    table: nchat_tags
    use-ssl: false

  mongodb:
    host: localhost
    port: 27017
    database: minecraft
    collection: nchat_tags
    use-auth: false
    username: ""
    password: ""
    auth-database: admin
custom-tags:
  enabled: true

  permission: "nchat.customtag"

  limits:
    - permission: "nchat.customtag.legendary"
      max-tags: 50
    - permission: "nchat.customtag.epic"
      max-tags: 40
    - permission: "nchat.customtag.mvp"
      max-tags: 30
    - permission: "nchat.customtag.elite"
      max-tags: 25
    - permission: "nchat.customtag.vip"
      max-tags: 20
    - permission: "nchat.customtag.plus"
      max-tags: 10
  default: 5

  cooldown: 60

  default-public: true

  cost:
    amount: 1000.0

    check-command: "eco check %player% %amount%"

    command: "eco take %player% %amount%"

  validation:
    min-length: 3
    max-length: 20
    block-special-chars: true
    blocked-chars: "<>{}[]|"
    word-filter: true
    blocked-words:
      - "admin"
      - "owner"
      - "mod"
      - "staff"

  messages:
    disabled: "<red>⚠ Las tags personalizadas están deshabilitadas."
    no-permission: "<red>⚠ No tienes permiso para crear tags personalizadas."

    creation-prompt:
      - ""
      - "<gradient:#FF0080:#FF8C00><bold>━━━━━━━━━ CREAR TAG PERSONALIZADA ━━━━━━━━━</bold></gradient>"
      - ""
      - "<yellow>Escribe en el chat el formato de tu tag personalizada."
      - "<gray>Ejemplo: <white>&b&lSTAFF → <aqua><bold>STAFF</bold></aqua>"
      - ""
      - "<yellow>Puedes usar:"
      - "  <gray>• Colores legacy (&a, &b, &c, etc.)"
      - "  <gray>• Formato (&l = negrita, &o = cursiva)"
      - "  <gray>• MiniMessage (<gradient:red:blue>texto</gradient>)"
      - ""
      - "<yellow>Costo: <green>$%cost%"
      - ""
      - "<red>Escribe <white>cancelar</white> para salir."
      - "<gradient:#FF0080:#FF8C00><bold>━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━</bold></gradient>"
      - ""

    edit-prompt:
      - ""
      - "<gradient:#FF0080:#FF8C00><bold>━━━━━━━━━ EDITAR TAG PERSONALIZADA ━━━━━━━━━</bold></gradient>"
      - ""
      - "<yellow>Tag actual: <white>%current_tag%"
      - ""
      - "<yellow>Escribe el nuevo formato para tu tag:"
      - "<gray>Ejemplo: <white>&c&lVIP</white> → <red><bold>VIP</bold></red>"
      - ""
      - "<red>Escribe <white>cancelar</white> para salir."
      - "<gradient:#FF0080:#FF8C00><bold>━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━</bold></gradient>"
      - ""

    created: "<green>✔ Tag personalizada creada exitosamente: %tag%"
    edited: "<green>✔ Tag personalizada editada: %tag%"
    deleted: "<yellow>Tag personalizada #%index% eliminada."
    equipped: "<green>✔ Tag personalizada equipada!"
    cancelled: "<yellow>Creación de tag cancelada."

    too-short: "<red>✖ La tag debe tener al menos %min% caracteres."
    too-long: "<red>✖ La tag no puede tener más de %max% caracteres."
    invalid-chars: "<red>✖ La tag contiene caracteres no permitidos."
    blocked-word: "<red>✖ La tag contiene palabras prohibidas."
    payment-failed: "<red>✖ No tienes suficiente dinero. Costo: $%cost%"

    max-tags-reached: "<red>✖ Ya tienes el máximo de tags (<gold>%count%<red>/<gold>%max%<red>). Elimina una para crear otra."
    no-custom-tag: "<red>✖ No tienes una tag personalizada en esa posición."
    cooldown: "<red>✖ Debes esperar %time% segundos para crear otra tag."

    visibility-public: "<green>✔ Tu tag ahora es <white>pública</white>: todos pueden verla en Explorar Tags."
    visibility-private: "<yellow>Tu tag ahora es <white>privada</white>: solo tú puedes verla."

    search-prompt:
      - ""
      - "<gradient:#00C6FF:#0072FF><bold>━━━━━━━━━ BUSCAR EN TUS TAGS ━━━━━━━━━</bold></gradient>"
      - ""
      - "<yellow>Escribe en el chat el texto o número de la tag que buscas."
      - "<gray>Escribe <white>todos</white> para quitar el filtro."
      - "<red>Escribe <white>cancelar</white> para salir."
      - ""
    search-applied: "<green>✔ Mostrando tags que coinciden con: <white>%term%"
    search-no-results: "<red>⚠ No se encontraron tags que coincidan con: <white>%term%"
    search-cleared: "<yellow>Se quitó el filtro de búsqueda."
    search-cancelled: "<yellow>Búsqueda cancelada."


  menu:
    title: "<dark_gray>Tags Customs (%count%/%max%) | Pág %page%/%pages%"
    rows: 6

    tag-slots:
      - 20
      - 21
      - 22
      - 23
      - 24
      - 29
      - 30
      - 31
      - 32
      - 33

    filler:
      enabled: true
      material: "BLACK_STAINED_GLASS_PANE"
      name: " "
      lore: []

    items:
      back:
        slot: 45
        material: "ARROW"
        name: "<yellow><- Volver"
        lore:
          - "<gray>Regresar al menú de tags."
        action: "BACK"

      close:
        slot: 49
        material: "NETHER_STAR"
        name: "<red>Cerrar Menú"
        lore:
          - "<gray>Cerrar este menú."
        action: "CLOSE"

      search:
        slot: 2
        material: "SPYGLASS"
        name: "<aqua><bold>Buscar Tag"
        lore:
          - "<gray>Busca entre tus tags por texto o número."
          - ""
          - "<gray>Búsqueda actual: <white>%search_term%"
          - ""
          - "<yellow>Click izquierdo: buscar"
          - "<yellow>Click derecho: quitar filtro"
        action: "SEARCH"

      sort:
        slot: 4
        material: "HOPPER"
        name: "<gold><bold>Orden: <white>%sort%"
        lore:
          - "<gray>Cambia el orden en que se muestran tus tags."
          - ""
          - "<gray>Modos: <white>Creación <gray>/ <white>A-Z"
          - ""
          - "<yellow>Click izquierdo: cambiar orden"
          - "<yellow>Click derecho: restablecer"
        action: "SORT"

      create:
        slot: 13
        material: "WRITABLE_BOOK"
        name: "<green><bold>+ Crear Nueva Tag"
        lore:
          - "<gray>Crea una tag personalizada nueva."
          - "<gray>El límite depende de tus permisos."
          - ""
          - "<yellow>Click para comenzar."
        action: "CREATE_TAG"

      browse:
        slot: 6
        material: "ENDER_EYE"
        name: "<gradient:#00C6FF:#0072FF><bold>Explorar Tags de Otros</bold></gradient>"
        lore:
          - "<gray>Mira las tags personalizadas"
          - "<gray>creadas por otros jugadores."
          - ""
          - "<yellow>Click para explorar."
        action: "BROWSE"


    navigation:
      next:
        slot: 53
        material: "ARROW"
        name: "<green>Siguiente Página ->"
        lore:
          - "<gray>Ir a la página %next_page%"
        action: "NEXT_PAGE"

      previous:
        slot: 52
        material: "ARROW"
        name: "<yellow><- Página Anterior"
        lore:
          - "<gray>Volver a la página %prev_page%"
        action: "PREVIOUS_PAGE"

      disabled:
        material: "BLACK_STAINED_GLASS_PANE"
        name: "<dark_gray>"
        lore: []

    tag-item:
      has-tag:
        material: "NAME_TAG"
        name: "<green>Tag #%index%: %tag%"
        lore:
          - "<gray>Tu tag personalizada."
          - ""
          - "<yellow>Click izquierdo: <white>equipar"
          - "<yellow>Click derecho: <white>editar / eliminar"
        equipped-lore:
          - ""
          - "<green>➜ Equipada actualmente"

      empty:
        material: "FIREWORK_STAR"
        name: "<green>+ Crear Tag"
        lore:
          - "<gray>Crea una nueva tag personalizada."
          - ""
          - "<yellow>Costo: <green>$%cost%"
          - ""
          - "<yellow>Click para comenzar."

      locked:
        material: "BARRIER"
        name: "<red>Máximo alcanzado"
        lore:
          - "<gray>Ya tienes el máximo de tags permitidas."
          - "<gray>Elimina una existente para crear otra."

    options-menu:
      title: "<gradient:#FF0080:#FF8C00><bold>Opciones - Tag #%index%</bold></gradient>"
      rows: 1

      filler:
        enabled: true
        material: "BLACK_STAINED_GLASS_PANE"
        name: " "
        lore: []

      items:
        equip:
          slot: 1
          material: "DIAMOND"
          name: "<aqua>Equipar Tag"
          lore:
            - "<gray>Equipa esta tag como tu tag activa."
            - ""
            - "<yellow>Click para equipar."
          action: "EQUIP"

        edit:
          slot: 3
          material: "BOOK"
          name: "<yellow>Editar Tag"
          lore:
            - "<gray>Modifica el contenido de esta tag."
            - ""
            - "<yellow>Click para editar."
          action: "EDIT"

        visibility:
          slot: 4
          action: "TOGGLE_VISIBILITY"
          public:
            material: "ENDER_EYE"
            name: "<green>Visibilidad: <white>Pública"
            lore:
              - "<gray>Todos los jugadores pueden ver"
              - "<gray>esta tag en <white>Explorar Tags<gray>."
              - ""
              - "<yellow>Click para hacerla privada."
          private:
            material: "ENDER_PEARL"
            name: "<red>Visibilidad: <white>Privada"
            lore:
              - "<gray>Solo tú puedes ver esta tag."
              - "<gray>No aparece en <white>Explorar Tags<gray>."
              - ""
              - "<yellow>Click para hacerla pública."

        delete:
          slot: 5
          material: "BARRIER"
          name: "<red>Eliminar Tag"
          lore:
            - "<gray>Elimina permanentemente esta tag."
            - ""
            - "<red>¡Esta acción no se puede deshacer!"
            - ""
            - "<yellow>Click para eliminar."
          action: "DELETE"

        back:
          slot: 7
          material: "ARROW"
          name: "<yellow><- Volver"
          lore:
            - "<gray>Regresar al menú de tags personalizadas."
          action: "BACK_TO_CUSTOM"

  browse-menu:
    title: "<gradient:#00C6FF:#0072FF><bold>Explorar Tags</bold></gradient> <dark_gray>• Pág %page%/%pages% (%total%)"
    rows: 6

    tag-slots:
      - 10
      - 11
