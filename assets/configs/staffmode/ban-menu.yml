      2: { summary: "&eMute 30m", commands: ["litebans:tempmute %player% 30m Insultos / Faltas de respeto [%modality%]"] }
      3: { summary: "&6Mute 3h", commands: ["litebans:tempmute %player% 3h Insultos / Faltas de respeto [%modality%]"] }
      4: { summary: "&cMute 1d", commands: ["litebans:tempmute %player% 1d Insultos / Faltas de respeto [%modality%]"] }

  insultos_staff:
    modalities: [ALL]
    material: "GOLDEN_HELMET"
    name: "&e&lFaltas de Respeto al Staff"
    description:
      - "&7Insultos, burlas o desobediencia hacia el Staff."
    levels:
      1: { summary: "&eMute 1d", commands: ["litebans:tempmute %player% 1d Faltas de respeto al Staff [%modality%]"] }
      2: { summary: "&6Mute 3d", commands: ["litebans:tempmute %player% 3d Faltas de respeto al Staff [%modality%]"] }
      3: { summary: "&cTempban 7d", commands: ["litebans:tempban %player% 7d Faltas de respeto al Staff [%modality%]"] }

  acoso:
