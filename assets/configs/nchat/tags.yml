        - "<red>Escribe <white>cancelar</white> para salir."
        - "<gradient:#FF0080:#FF8C00><bold>━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━</bold></gradient>"
        - ""
      search-cancelled: "<yellow>Búsqueda cancelada."
