# Diseñado como NewSkills. Todos los slots, sonidos, nombres, materiales y acciones editables.
# Format: &a, &l, &#RRGGBB, #RRGGBB, <red>, <gradient:#00f2fe:#4facfe>texto</gradient>.
# material: PLAYER_HEAD + base64: <textura> o material: basehead-<base64>.
# sounds: click-sound: false, "ENTITY_EXPERIENCE_ORB_PICKUP" o {enabled: true, type: 'tu_pack:ui.click', volume: 1.0, pitch: 1.0}
# Acciones: [open] overview|detail|sources|rewards|quests|contracts|top,
# [join], [leave], [claim], [claim-all], [claim-quest], [contract] basic, [prestige], [page] next|previous,
# [message] texto, [player] comando, [console] comando, [back], [close], [force-close].
# Variables: {player}, {job}, {job_display}, {level}, {xp}, {required_xp}, {progress},
# {points}, {earned_money}, {joined_jobs}, {max_jobs}, {prestige}, {quest_current},
# {quest_total}, {quest_action}, {contract_time}, {page}, {max_pages}, {reward_level},
# {reward_status}, {top_uuid}, {subject}, {action}, {gain_money}, {gain_xp}.
# ESC/E vuelve al menú anterior; [force-close] cierra definitivamente.

menus-version: 2

sounds:
  click:
    enabled: true
    type: UI_BUTTON_CLICK
    volume: 0.7
    pitch: 1.2
  success:
    enabled: true
    type: ENTITY_PLAYER_LEVELUP
    volume: 0.8
    pitch: 1.3
  error:
    enabled: true
    type: ENTITY_VILLAGER_NO
    volume: 0.7
    pitch: 1.0

menus:
  overview:
    title: '<gradient:#00f2fe:#4facfe><bold>NEWJOBS &8| &fTRABAJOS</bold></gradient>'
    size: 54
    fill:
      enabled: true
      material: BLACK_STAINED_GLASS_PANE
      name: '&7'
      slots: [45, 46, 47, 48, 49, 50, 51, 52, 53]
    job-icon:
      name: '{job_display} &8| &fNivel &e{level}'
      lore:
        - ''
        - '&f{description}'
        - ''
        - '&8▪ &fNivel: &#ffd65f{level}'
        - '&8▪ &fXP: &#00f2fe{xp}&7/&#00f2fe{required_xp}'
        - '&8▪ &fEstado: {joined_status}'
        - ''
        - '&#00f2fe✔ ¡Click para ver el trabajo!'
