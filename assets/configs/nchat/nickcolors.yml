        slot: 13
        material: "hdb-24796"
        name: "<gradient:#11998e:#38ef7d>Nick Selvático"
        lore:
          - "<gray>Gradiente de naturaleza."
        format: "<gradient:#11998e:#38ef7d>"
        permission: "nchat.nick.nature"

      grad_sunset:
        page: 2
        slot: 14
        material: "CLOCK"
        name: "<gradient:#fa709a:#fee140>Nick Atardecer"
        lore:
          - "<gray>Colores suaves de atardecer."
        format: "<gradient:#fa709a:#fee140>"
        permission: "nchat.nick.sunset"

      btn_prev:
        page: 2
        slot: 52
        material: "ARROW"
        name: "<yellow><- Página Anterior"
        lore:
          - "<gray>Volver a colores básicos"
        action: "PREVIOUS_PAGE"
