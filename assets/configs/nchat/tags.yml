    items:
      search:
        slot: 3
        material: "SPYGLASS"
        name: "<aqua><bold>Buscar"
        lore:
          - "<gray>Busca por texto de la tag o por jugador."
          - ""
          - "<gray>Búsqueda actual: <white>%search_term%"
          - ""
          - "<yellow>Click izquierdo: buscar"
          - "<yellow>Click derecho: quitar filtro"
        action: "SEARCH"

      sort:
        slot: 5
        material: "HOPPER"
        name: "<gold><bold>Orden: <white>%sort%"
        lore:
          - "<gray>Modos: <white>Jugador (A-Z) <gray>/ <white>Tag (A-Z)"
          - ""
          - "<yellow>Click izquierdo: cambiar orden"
          - "<yellow>Click derecho: restablecer"
        action: "SORT"

      back:
        slot: 45
        material: "ARROW"
        name: "<yellow><- Volver"
        lore:
          - "<gray>Volver a tus tags personalizadas."
        action: "BACK"

      close:
        slot: 49
        material: "OAK_DOOR"
        name: "<red>Cerrar Menú"
        lore:
          - "<gray>Cerrar este menú."
        action: "CLOSE"

      no-tags:
        enable: true
        slot: 22
        material: "BARRIER"
        name: "<red>No hay tags para mostrar"
        lore:
          - "<gray>Nadie más ha creado tags personalizadas"
          - "<gray>o ninguna coincide con tu búsqueda."

    navigation:
      next:
        slot: 53
        material: "ARROW"
        name: "<green>Siguiente Página ->"
        lore:
          - "<gray>Ir a la página %next_page%"
        action: "NEXT_PAGE"

      previous:
        slot: 52
        material: "ARROW"
        name: "<yellow><- Página Anterior"
        lore:
          - "<gray>Volver a la página %prev_page%"
        action: "PREVIOUS_PAGE"

      disabled:
        material: "BLACK_STAINED_GLASS_PANE"
        name: "<dark_gray>"
        lore: []

    # Cada tag de otro jugador. %player% = dueño, %tag% = formato de la tag
    tag-item:
      material: "PLAYER_HEAD"
      name: "<white>%tag% <dark_gray>• <gray>%player%"
      lore:
        - "<gray>Creada por: <white>%player%"
        - "<gray>Vista previa: %tag%"
        - ""
        - "<dark_gray>Solo lectura: no puedes equipar"
        - "<dark_gray>ni editar tags de otros jugadores."
      self-lore:
        - "<gray>Creada por: <green>ti"
        - "<gray>Vista previa: %tag%"
        - ""
        - "<yellow>Edítala desde <white>Tus Tags <yellow>(click derecho)."

    messages:
      search-prompt:
        - ""
        - "<gradient:#00C6FF:#0072FF><bold>━━━━━━━━━ BUSCAR TAGS ━━━━━━━━━</bold></gradient>"
        - ""
        - "<yellow>Escribe el texto de la tag o el nombre del jugador."
