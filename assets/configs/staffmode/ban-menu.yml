settings:
  execute-as: "PLAYER"
  default-modality: ""
  use-bungee-servers: true
  excluded-servers:
    - "Auth"
    - "Lobby"
  notify:
    permission: "nstaffmode.ban.notify"
    message: "&8[&c&lSanción&8] &b%player% &fsancionado por &b%staff% &8» &e%sanction% &8[&7%modality%&8] &7(&f%summary%&7)"

messages:
  no-permission: "&cNo tienes permiso para aplicar esta sanción."

menus:
  modality:
    title: "&c&lSancionar: &f%player%"
    size: 27
    fill-material: "GRAY_STAINED_GLASS_PANE"
    fill-name: " "
    close-slot: 22
    close-item:
      material: "BARRIER"
      name: "&c&lCancelar"
      lore:
        - "&7Cerrar sin aplicar sanción"

  sanctions:
    title: "&c&l%modality%: &f%player%"
    size: 54
    fill-material: "GRAY_STAINED_GLASS_PANE"
    fill-name: " "
    sanction-slots: [10, 11, 12, 13, 14, 15, 16, 19, 20, 21, 22, 23, 24, 25, 28, 29, 30, 31, 32, 33, 34, 37, 38, 39, 40, 41, 42, 43]
    info-slot: 4
    previous-slot: 48
    back-slot: 49
    next-slot: 50
    level-line: "&8» &fNivel %level%/%total%: %summary%"
    direct-line: "&8» %summary%"
    levels-footer: "&aHaz clic para abrir niveles."
    direct-footer: "&4Haz clic para ejecutar."
    no-permission-line: "&c&oNo tienes permiso para esta sanción."
    info-item:
      material: "PLAYER_HEAD"
      name: "&f&l%player%"
      lore:
        - "&7Modalidad: &f%modality%"
        - "&7Sanciones disponibles: &f%total%"
        - "&7Página: &f%page%&7/&f%pages%"
    previous-item:
      material: "ARROW"
      name: "&c&l« Página Anterior"
      lore:
        - "&7Página &f%page%&7/&f%pages%"
        - ""
        - "&eClic para volver"
    next-item:
      material: "ARROW"
      name: "&a&lPágina Siguiente »"
      lore:
        - "&7Página &f%page%&7/&f%pages%"
        - ""
        - "&eClic para continuar"
    back-item:
      material: "BARRIER"
      name: "&c&lVolver a Modalidades"
      lore:
        - "&7Regresa a elegir modalidad."
    close-item:
      material: "BARRIER"
      name: "&c&lCerrar"
      lore:
        - "&7Cerrar sin aplicar sanción"

  levels:
    title: "&c&l%sanction%: &f%player%"
    size: 27
    fill-material: "GRAY_STAINED_GLASS_PANE"
    fill-name: " "
    row: 1
    sanction-slot: 4
    back-slot: 22
    level-materials:
      - "LIME_CONCRETE"
      - "YELLOW_CONCRETE"
      - "ORANGE_CONCRETE"
      - "RED_CONCRETE"
      - "PURPLE_CONCRETE"
      - "BLACK_CONCRETE"
    level-item:
      name: "&6&lNivel %level%/%total%"
      lore:
        - "&7Sanción: %summary%"
        - "&7Jugador: &f%player%"
        - ""
        - "&eHaz clic para aplicar."
    back-item:
      material: "BARRIER"
      name: "&c&lVolver"
      lore:
        - "&7Regresa a la lista de sanciones."

modalities:
  Prison:
    server: "Prison"
    material: "DIAMOND_PICKAXE"
    display: "&b&lPrison"
    slot: 13
    lore:
      - "&7Sancionar a &f%player% &7en &bPrison&7."
      - ""
      - "&eHaz clic para continuar."

sanctions:
  spam:
    modalities: [ALL]
    material: "PAPER"
    name: "&e&lSpam / Flood / Toxicidad"
    description:
      - "&7Faltas reiteradas en chat general."
    levels:
      1: { summary: "&aWarn", commands: ["litebans:warn %player% Spam / Flood / Toxicidad [%modality%]"] }
      2: { summary: "&eMute 1h", commands: ["litebans:tempmute %player% 1h Spam / Flood / Toxicidad [%modality%]"] }
      3: { summary: "&cMute 2h", commands: ["litebans:tempmute %player% 2h Spam / Flood / Toxicidad [%modality%]"] }

  ddos:
    modalities: [ALL]
    material: "TNT"
    name: "&c&lAmenazas DDoS / Doxing"
    description:
      - "&7Amenazas graves o revelación de datos."
    levels:
      1: { summary: "&eTempban 15d", commands: ["litebans:tempban %player% 15d Amenazas DDoS / Doxing [%modality%]"] }
      2: { summary: "&cTempban 30d", commands: ["litebans:tempban %player% 30d Amenazas DDoS / Doxing [%modality%]"] }

  comandos:
    modalities: [ALL]
    material: "FEATHER"
    name: "&b&lMal uso de comandos"
    description:
      - "&7Congestión o abuso de helpop, report, etc."
    levels:
      1: { summary: "&aWarn 15d", commands: ["litebans:tempwarn %player% 15d Mal uso de comandos [%modality%]"] }
      2: { summary: "&cTempban 1d", commands: ["litebans:tempban %player% 1d Mal uso de comandos [%modality%]"] }

  nick:
    modalities: [ALL]
    material: "NAME_TAG"
    name: "&d&lNick Inapropiado"
    description:
      - "&7Nombres ofensivos o simulación de Staff."
    levels:
      1: { summary: "&aWarn", commands: ["litebans:warn %player% Nick Inapropiado [%modality%]"] }
      2: { summary: "&eTempban 15d", commands: ["litebans:tempban %player% 15d Nick Inapropiado [%modality%]"] }
      3: { summary: "&cTempban 30d", commands: ["litebans:tempban %player% 30d Nick Inapropiado [%modality%]"] }

  filtrar_info:
    modalities: [ALL]
    material: "REDSTONE"
    name: "&4&lFiltrar Información"
    description:
      - "&7Filtrar datos de usuarios/staff."
    summary: "&cBanIP Permanente"
    commands:
      - "litebans:banip %player% Filtrar informacion [%modality%]"

  pasar_ip:
    modalities: [ALL]
    material: "ENDER_EYE"
    name: "&4&lPasar IP de otro servidor"
    description:
      - "&7Publicidad externa de servidores activos."
    summary: "&cBan Permanente"
    commands:
      - "litebans:ban %player% Pasar IP [%modality%]"

  dupe:
    modalities: [ALL]
    material: "REDSTONE_BLOCK"
    name: "&4&lDupe / Explotación Económica"
    description:
      - "&7Duplicación masiva o manipulación económica."
    summary: "&cBan Permanente"
    commands:
      - "litebans:ban %player% Dupe [%modality%]"

  multialts:
    modalities: [ALL]
    material: "WRITABLE_BOOK"
    name: "&4&lMultiAlts Hacked"
    description:
      - "&7Uso de cuentas secundarias para hacks."
    summary: "&cBanIP 30 días"
    commands:
      - "litebans:banip %player% 30d MultiAlts Hacked [%modality%]"

  hacks_evidentes:
    modalities: [ALL]
    material: "NETHERITE_SWORD"
    name: "&4&lUso de Hacks Evidentes"
    description:
      - "&7Reportes con video de clientes ilegales."
    summary: "&cTempban 30 días"
    commands:
      - "litebans:tempban %player% 30d Uso de Hacks Evidentes [%modality%]"

  cheats_ss:
    modalities: [ALL]
    material: "COMPASS"
    name: "&c&lCheats Found in SS"
    description:
      - "&7Hacks en revisión con uso < 10 días."
    summary: "&cTempban 30 días"
    commands:
      - "litebans:tempban %player% 30d Cheats Found in SS [%modality%]"

  negarse_ss:
    modalities: [ALL]
    material: "BARRIER"
    name: "&c&lNegarse a la SS"
    description:
      - "&7Desconexión, demora o insultos al congelar."
    summary: "&cTempban 30 días"
    commands:
      - "litebans:tempban %player% 30d Refuse to SS [%modality%]"

  cheats_ss_nouso:
    modalities: [ALL]
    material: "CLOCK"
    name: "&e&lCheats Found in SS [No Uso]"
    description:
      - "&7Hacks encontrados con uso de 11 a 30 días."
    summary: "&eTempban 15 días"
    commands:
      - "litebans:tempban %player% 15d Cheats Found in SS (No Uso) [%modality%]"

  hacks_admitidos:
    modalities: [ALL]
    material: "WOODEN_SWORD"
    name: "&e&lHacks Admitidos"
    description:
      - "&7Admitir uso de modificaciones ilegales."
    summary: "&eTempban 15 días"
    commands:
      - "litebans:tempban %player% 15d Uso de Hacks Admitido [%modality%]"

  griefing_prison:
    modalities: [ALL]
    material: "IRON_PICKAXE"
    name: "&6&lGriefing / Robo / Estafas"
    description:
      - "&7Daño a propiedades, robo o estafas."
    levels:
      1: { summary: "&aTempban 7d", commands: ["litebans:tempban %player% 7d Griefing / Robo / Estafas [%modality%]"] }
      2: { summary: "&eTempban 15d", commands: ["litebans:tempban %player% 15d Griefing / Robo / Estafas [%modality%]"] }
      3: { summary: "&cTempban 30d", commands: ["litebans:tempban %player% 30d Griefing / Robo / Estafas [%modality%]"] }

  afk_automatizacion:
