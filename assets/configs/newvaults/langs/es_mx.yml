prefix: "&#55FF00&lNewVaults &7»&r "

messages:
  no-permission: "<red>No tienes permiso para hacer esto."
  vault-locked: "<red>No tienes acceso al vault #%vault%."
  player-not-found: "<red>El jugador %player% no esta conectado."

vault-gui:
  title: "<yellow>Vault #%vault%"

selector:
  title: "<yellow>Vaults</yellow> <white>| MENU</white>"
  close-item:
    name: "<red>Cerrar"
    lore:
      - "<gray>Click para cerrar este menu"
  previous-page-item:
    name: "<yellow>« Pagina anterior"
    lore:
      - "<gray>Click para ir a la pagina anterior"
  next-page-item:
    name: "<yellow>Pagina siguiente »"
    lore:
      - "<gray>Click para ir a la siguiente pagina"
  unlocked-item:
    name: "<yellow>Private Vault</yellow> <gray>| <white>#%vault%"
    lore:
      - "<gray><italic>(( Click para abrir este vault ))"
      - ""
      - "<gray>Usados: <white>%used%<gray>/<white>%max%"
  locked-item:
    name: "<yellow>Private Vault</yellow> <gray>| <white>#%vault%"
    lore:
      - "<red><bold>BLOQUEADO"
      - "<gray>No tienes acceso a este vault."

admin:
  usage:
    reload: "<yellow>/vaultadmin reload"
    open: "<yellow>/vaultadmin open <jugador>"
    view: "<yellow>/vaultadmin view <jugador> <numero>"
    save: "<yellow>/vaultadmin save"
  usage-open: "<red>Uso: /vaultadmin open <jugador>"
  usage-view: "<red>Uso: /vaultadmin view <jugador> <numero>"
  reload-success: "<green>Configuracion e idioma recargados."
  save-success: "<green>Guardando todos los vaults en cache."
  player-not-found: "<red>Jugador no encontrado."
  invalid-number: "<red>Numero de vault invalido."
  unknown-subcommand: "<red>Subcomando desconocido."