      player_profile:
        page: 1
        slot: 45
        fixed: true
        material: "PLAYER_HEAD"
        name: "<green>Tu Perfil"
        lore:
          - "<gray>Hola, <aqua>%player_name%</aqua>"

      info_item:
        page: 1
        slot: 46
        fixed: true
        material: "PAPER"
        name: "<yellow>Información del Nick"
        lore:
          - "<gray>Selecciona el color para tu nombre."
          - "<gray>Esto aparecerá en el Chat y TAB."

      itemcustom1:
        page: 1
        slot: 47
        fixed: true
        material: "BLACK_STAINED_GLASS_PANE"
        name: "<yellow>"
        lore:
          - "<gray>"
      itemcustom2:
        page: 1
        slot: 48
        fixed: true
        material: "BLACK_STAINED_GLASS_PANE"
        name: "<yellow>"
        lore:
          - "<gray>"

      close_menu:
        page: 1
        slot: 49
        fixed: true
        material: "REDSTONE"
        name: "<red>Cerrar Menú"
        action: "CLOSE"

      itemcustom3:
        page: 1
        slot: 50
        fixed: true
        material: "BLACK_STAINED_GLASS_PANE"
        name: "<yellow>"
        lore:
          - "<gray>"
      itemcustom4:
        page: 1
        slot: 51
        fixed: true
        material: "BLACK_STAINED_GLASS_PANE"
        name: "<yellow>"
        lore:
          - "<gray>"

      reset_color:
        page: 1
        slot: 53
        fixed: true
        material: "REPEATER"
        name: "<red>Restablecer Nick"
        lore:
          - "<gray>Vuelve al nombre blanco original"
        format: ""
        permission: "nchat.nick.reset"
        sound:
          type: "UI_BUTTON_CLICK"
          volume: 1.0
          pitch: 1.0
        # Item temporal que aparece mientras se restablece el color del nick.
        reset-status-item:
          material: "GUNPOWDER"
          name: "<yellow><bold>Reiniciando tu nick...</bold>"
          lore:
            - "<gray>Aplicando el color por defecto..."
          duration-ticks: 20

      btn_next:
        page: 1
        slot: 52
        material: "ARROW"
        name: "<yellow>Siguiente Página ->"
        lore:
          - "<gray>Ver Nicks con Gradientes"
        action: "NEXT_PAGE"

      #                        PÁGINA 2
      grad_rainbow:
        page: 2
        slot: 10
        material: "NETHER_STAR"
        name: "<rainbow>Nick Arcoiris"
        lore:
          - "<gray>¡Nombre con colores animados!"
          - "<yellow>Solo para usuarios VIP"
        format: "<rainbow>"
        permission: "nchat.nick.rainbow"

      grad_fire:
        page: 2
        slot: 11
        material: "hdb-7129"
        name: "<gradient:#ff512f:#dd2476>Nick de Fuego"
        lore:
