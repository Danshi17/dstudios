main: me.danshi.blockRewards.BlockRewards

menu:
  title: "&8&lTus Block Rewards"
  rows: 6
  sounds:

    open-menu: "CHEST_OPEN"
    open-menu-volume: 1.0
    open-menu-pitch: 1.0
    click-ready: "ORB_PICKUP"
    click-ready-volume: 1.0
    click-ready-pitch: 1.2
    click-locked: "VILLAGER_NO"
    click-locked-volume: 1.0
    click-locked-pitch: 1.0
    click-claimed: "ITEM_PICKUP"
    click-claimed-volume: 0.7
    click-claimed-pitch: 0.8
    close-menu: "CHEST_CLOSE"
    close-menu-volume: 1.0
    close-menu-pitch: 1.0
    open-all: "LEVEL_UP"
    open-all-volume: 1.0
    open-all-pitch: 1.3

  pagination:

    previous-button:
      material: "ARROW"
      slot: 7
      name: "&a&l<- Pagina Anterior"
      lore:
        - "&7Haz click para regresar a"
        - "&7la pagina anterior."

    next-button:
      material: "ARROW"
      slot: 8
      name: "&a&lPagina Siguiente ->"
      lore:
        - "&7Haz click para avanzar a"
        - "&7la siguiente pagina."

  sort-button:
    slot: 45
    material: "HOPPER"
    name-ready-first: "&e&lFiltro: Listo Primero"
    lore-ready-first:
      - "&7Estado actual: &aCompletados Primero"
      - ""
      - "&eHaz click para alternar al"
      - "&eorden de configuracion."

    name-default: "&6&lFiltro: Por Defecto"

    lore-default:
      - "&7Estado actual: &cOrden por Defecto"
      - ""
      - "&eHaz click para alternar al"
      - "&efiltro de listos primero."

  open-all-button:
    slot: 4
    material: "CHEST"
    name: "&d&lAbrir Todo lo Disponible"
    lore:
      - "&7Haz click para abrir de golpe"
      - "&7todos tus Block Rewards completados."
      - ""
      - "&eDisponibles en total: &a{total_ready}"

  autoclaim-button:
    enabled: true
    slot: 36
    material: "HOPPER"
    name-active: "&a&lAuto-Claim: ACTIVADO"
    name-inactive: "&7&lAuto-Claim: DESACTIVADO"
    lore-active:
      - "&7Las recompensas se entregan"
      - "&7automaticamente al completarse."
      - ""
      - "&eClick para desactivar."
    lore-inactive:
      - "&7Click aqui para que las"
      - "&7recompensas se entreguen"
      - "&7solas al completarse."
      - ""
      - "&eClick para activar."

  prestige-button:
    enabled: true
    slot: 49
    material: "NETHER_STAR"
    name: "&6&l✦ Prestigio &6✦"
    lore:
      - "&7Tu prestigio actual: &e{prestige}"
      - "&7Total de prestigios: &e{total_prestiges}"
      - ""
      - "&7Resetea TODAS tus recompensas"
      - "&7y te permite volver a farmearlas."
      - ""
      - "&eClick para prestigiar."

  background:

    material: "STAINED_GLASS_PANE:15"
    name: " "
    lore: []
    slots:
      - 46
      - 47
      - 48
      - 50
      - 51
      - 52

  item-slots:
    - 10
    - 11
    - 12
    - 13
    - 14
    - 15
    - 16
    - 19
    - 20
    - 21
    - 22
    - 23
    - 24
    - 25
    - 28
    - 29
    - 30
    - 31
    - 32
    - 33
    - 34

  filter:
    enabled: false
    items:
      - "tier_1"
      - "tier_2"
    button:
      material: "HOPPER"
      slot: 53
      name-active: "&a&lFiltro: Activado"
      name-inactive: "&7&lFiltro: Desactivado"
      lore-active:
        - "&7Filtro activo. Solo se muestran:"
        - "&a{items}"
        - ""
        - "&eClick para desactivar."
      lore-inactive:
        - "&7Mostrando todos los Block Rewards."
        - ""
        - "&eClick para activar el filtro."

  lore-ready:
    - "&8&m-----------"
    - "&aTienes &e{ready} &alisto(s) para abrir!"
    - "&7Click para abrir uno."
    - "&8&m-----------"

  lore-locked:
    - "&8&m-----------"
    - "&7Progreso: &e{progress}&7/&e{required}"
    - "&cSigue minando para completarlo!"
    - "&8&m-----------"

  lore-not-found:
    - "&8&m-----------"
    - "&7Aun no has encontrado este nivel."
    - "&7Sigue minando para empezar!"
    - "&8&m-----------"

  lore-claimed:
    - "&8&m-----------"
    - "&7Ya reclamaste este nivel."
    - "&7Sigue minando para desbloquear"
    - "&7el siguiente."
    - "&8&m-----------"