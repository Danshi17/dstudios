# NewSkills - Vista general de NewSkills inspirada en el inventario de la captura.
# /skills o /mcmmo abre el menú; /skills reload recarga ESTE archivo y messages.yml.
# Nuevas opciones se agregan automáticamente si faltan (backup antes de guardar).
# Botón RECOMPENSAS de cada habilidad: menus.detail.items.rewards (slot 5).
# Botón TOP de cada habilidad: menus.detail.items.leaderboard (slot 13).
# 9 slots por fila: fila 1=0..8, fila 2=9..17, ..., fila 6=45..53.
# Todos los materiales, títulos, slots, cabezas, sonidos, nombres, lore y acciones son editables.
# Materiales de cabezas: material: PLAYER_HEAD + base64: 'eyJ...'
# O directamente material: 'basehead-eyJ...'; también material: 'base64:eyJ...'
# También skull-owner: '{player}' para usar una cabeza de jugador normal.
# Filler e ítems: name, display_name y display-name disponibles.
# ESC/E desde submenús abre el menú anterior. [force-close] cierra todo.
# Formatos: &a, &l, &#FF7744, #FF7744, <red>, <gradient:#F00:#00F>...</gradient>
# skills.<HABILIDAD>.display-name configura {skill_display} en TODOS los menús.
# skills.<HABILIDAD>.name configura SOLO el texto del icono principal.
# click-sound funciona en botones, skills, fillers, ability-item, source-item y rewards.levels.*.
# click-sound: { enabled: true, type: ENTITY_EXPERIENCE_ORB_PICKUP, volume: 0.8, pitch: 1.2 }
# O click-sound: 'minecraft:block.note_block.pling' / 'mi_pack:ui.personalizado'.
# click-sound: false silencia solo ese item; si falta, se mantiene sounds.click global.
# Variables: {player}, {skill}, {skill_upper}, {skill_display}, {level}, {xp},
# {required_xp}, {remaining_xp}, {progress}, {progress_bar}, {power_level},
# {xp_multiplier}, {skill_multiplier}, {abilities_preview}; soporta PlaceholderAPI.
# Acciones: [open] detail, [open] overview, [open] abilities, [open] xp,
# [page] next, [page] previous, [open] leaderboard, [leaderboard-refresh],
# [open] rewards, [open] prestige, [claim-all], [prestige], [open] SWORDS, [close], [back], [force-close], [message] ...,
# [player] comando, [console] comando, [skill-command], [sound] UI_BUTTON_CLICK.
# Para esconder un item: enabled: false. Para restringir: view-permission y click-permission.
# Además puedes poner slots: [0, 1, 2] en cualquier item de menus.*.items.

