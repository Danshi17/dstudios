id: ally
title: '<dark_gray>Allies <gray>»</gray> %clan_tag%</dark_gray>'
rows: 6
page-size: 28
open-sound: UI_BUTTON_CLICK

dynamic:
  type: ALLIES
  slots: '10-16,19-25,28-34,37-43'
  material: PLAYER_HEAD
  head-owner: '%relation_leader_uuid%'
  name: '<green>%relation_clan%</green>'
  lore:
    - '<gray>Leader: <white>%relation_leader%</white></gray>'
    - '<gray>Members: <white>%relation_members%</white></gray>'
    - '<gray>Level: <white>%relation_level%</white></gray>'
    - '<gray>Points: <white>%relation_points%</white></gray>'
    - ''
    - '<yellow>Left-click: clan stats</yellow>'
    - '<red>Right-click: remove ally</red>'

items:
  border:
    material: GRAY_STAINED_GLASS_PANE
    name: ' '
    slots: '0-8,9,17,18,26,27,35,36,44,45-53'
  add:
    slot: 47
    material: LIME_DYE
    name: '<green>Add Ally</green>'
    lore:
      - '<gray>Use <white>/clan ally add <clan></white></gray>'
    action: CLOSE
  previous:
    slot: 48
    material: ARROW
    name: '<yellow>Previous Page</yellow>'
    action: PAGE_PREVIOUS
  back:
    slot: 49
    material: OAK_DOOR
    name: '<red>Back</red>'
    action: OPEN:clan_home
  next:
    slot: 50
    material: ARROW
    name: '<yellow>Next Page</yellow>'
    action: PAGE_NEXT
