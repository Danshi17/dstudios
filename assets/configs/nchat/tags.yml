          material: "EMERALD_BLOCK"
          name: "<green>Comprar Tag Millonario"
          lore:
            - "<gray>Este tag cuesta dinero."
            - ""
            - "<gray>Precio: <yellow>$%cost%"
            - "<yellow>Click para comprar ahora."
        locked:
          material: "BARRIER"
          name: "<red>Bloqueado"
          lore:
            - "<gray>Necesitas <yellow>$%cost%<gray>."

      tag_verified:
        material: "hdb-18432"
        name: "<green>Tag Verificado"
        lore:
          - "<gray>Tag exclusiva de verificados."
        tag: "<green>[✔] "
        permission: "nchat.tag.verified"
        category: "Especiales"
        locked:
          material: "GRAY_DYE"
          name: "<gray>Bloqueado"
