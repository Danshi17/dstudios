staffmode-options:
  # (CREATIVE, SURVIVAL, ADVENTURE, SPECTATOR)
  gamemode: "CREATIVE"

  allow-flight: true
  invincible: true

  vanish: true

  night-vision: true

staff-mode:
  blocked-commands:
    - "trade"
    - "axtrade"
    - "comerciar"
    - "t"
    - "traderequest"
    - "traderequests"
    - "tr"
  allowed-gui-titles:
    - "INFERNALMC"
    - "Survival Custom"
    - "FullPvP"
    - "FastFarm"
    - "Niveles"


title-on-enable:
  title: "&e&lSTAFF"
  subtitle: "&fModo &aActivado"
  fade-in: 10
  stay: 40
  fade-out: 10

messages:
  no-permission: "&cNo tienes permiso para ejecutar este comando."
  staffmode-enabled: "&aHas entrado en el modo staff."
  staffmode-disabled: "&cHas salido del modo staff."
  config-reloaded: "&aLa configuración de NStaffMode ha sido recargada."
  teleported: "&aTe has teletransportado a &e%player%&a."
  vanish-enabled: "&aAhora eres invisible para los jugadores."
  vanish-disabled: "&cAhora eres visible para todos."
  random-tp-success: "&aHas sido teletransportado a &e%player%&a."
  random-tp-no-players: "&cNo se encontraron jugadores a los que teletransportarse."

  command-blocked-staffmode: "&c¡No puedes usar ese comando mientras estás en Staff Mode!"

  staff-item-protected: "&c¡No puedes mover items del StaffMode fuera de tu inventario!"

  actionbar-vanish-on: "&e&lModo Staff &8| &aVanish: Activado"
  actionbar-vanish-off: "&e&lModo Staff &8| &cVanish: Desactivado"

  cps-wrong-usage: "&c&lUSO: &7/cps <jugador>"
  cps-player-not-found: "&c&lERROR: &7Ese jugador no está en línea."
  cps-test-already-running: "&c&lERROR: &7Ese jugador ya está siendo analizado."
  cps-test-started-staff: "&e&lCPS: &7Iniciando prueba silenciosa de 15s en &f%player%&7."
  cps-test-finished: "&e&lCPS: &7La prueba de &f%player% &7ha finalizado. &bResultado: &l%cps% clicks/s&r &7(&f%clicks% clicks&7)"
  cps-test-interrupted: "&c&lCPS: &7La prueba de &f%player% &7ha sido interrumpida porque se ha desconectado."

  player-frozen: "&b%player% &fha sido congelado por &b%staff%&f."
  player-unfrozen: "&b%player% &fha sido descongelado por &b%staff%&f."

  player-kicked: "&b%player% &fha sido expulsado por &b%staff%&f. Razón: &e%reason%"
  player-banned: "&b%player% &fha sido baneado por &b%staff%&f. Razón: &e%reason%"
