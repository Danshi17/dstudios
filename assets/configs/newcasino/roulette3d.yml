settings:
  enabled: true
  currency: VAULT
  interaction-distance: 9.0
  min-bet: 10.0
  max-bet: 1000000.0
  max-bets-per-player: 1
  create-y-offset: -1.5
  bet-amounts:
    - 100.0
    - 500.0
    - 1000.0
    - 5000.0
    - 10000.0
  countdown-seconds: 20
  spin-seconds: 9
  result-seconds: 6
  revolutions: 6
  push-back:
    enabled: true
    radius: 5.5
    height: 4.0
    strength: 0.7
    lift: 0.25
    sound-cooldown-ticks: 10
    ignore-spectators: true
    bypass-permission: ''

payouts:
  red: 2.0
  black: 2.0
  green: 36.0
  odd: 2.0
  even: 2.0
  low: 2.0
  high: 2.0
  dozen: 3.0
  column: 3.0
  number: 36.0

visual:
  radius: 5.0
  pocket-center-spacing: 0.85
  height: 1.15
  pointer-angle: -90
  pocket-head-offset: 0.95
  small-armorstand-head-offset: 0.95
  selector:
    radial-offset: 0.0
    height-offset: 0.90
    rotation-degrees: -135.0
    scale: 1.3
  animation:
    particles: true
    idle:
      enabled: true
      speed-degrees-per-tick: 0.4
      update-interval-ticks: 1
      during-result: true
    tracer:
      enabled: true
      material: SEA_LANTERN
      base64: ''
      custom_model_data: 0
      height-offset: 0.14
  finish-animation:
    enabled: true
    start-height: 9.0
    final-height: 3.4
    descend-ticks: 70
    revolutions: 2.0
    chest-scale: 2.0
    chest-facing: SOUTH
    use-real-chest: true
    # Oculta el holograma mientras dura la animacion y lo vuelve a mostrar al terminar.
    hide-hologram: true
    open-delay-ticks: 10
    reveal-ticks: 40
    hold-ticks: 35
    close-ticks: 12
    firework-ticks: 24
    item-scale: 1.6
    item-rise: 1.4
    name-offset: 0.65
    chest:
      material: ENDER_CHEST
      base64: ''
      custom_model_data: 0
    win:
      item:
        material: SUNFLOWER
        base64: ''
        display_name: '<gradient:#FFD65F:#F0A51B><bold>¡GANASTE {PAYOUT} {CURRENCY}!</bold></gradient>'
        lore:
          - '&7Mesa: &f{TABLE} &8| &7Número: &f{RESULT} &7({COLOR})'
        custom_model_data: 0
        glow: true
      fireworks:
        type: BALL_LARGE
        flicker: true
        trail: true
        bursts: 6
        radius: 2.5
        colors: ['#FFD65F', '#4EFF88', '#00F2FE', '#FF416C', '#B388FF']
        fade-colors: ['#FFFFFF']
    lose:
      item:
        material: BARRIER
        base64: ''
        display_name: '<gradient:#FF4B2B:#FF416C><bold>NO GANASTE NADA</bold></gradient>'
        lore:
          - '&7Mesa: &f{TABLE} &8| &7Número: &f{RESULT} &7({COLOR})'
        custom_model_data: 0
        glow: false
      fireworks:
        type: BALL
        flicker: false
        trail: true
        bursts: 4
        radius: 2.5
        colors: ['#FF4B2B', '#9CA3AF', '#FF416C']
        fade-colors: ['#4B5563']
  show-pocket-names: false
  numbers: {}
  base:
    material: DARK_OAK_PLANKS
    base64: ''
    custom_model_data: 0
  centerpiece:
    material: GOLD_BLOCK
    base64: ''
    custom_model_data: 0
  hologram-enabled: true
  hologram-height: 3.2
  hologram-line-spacing: 0.28
  hologram-lines:
    - '<gradient:#00E5FF:#45B5FF><bold>RULETA 3D</bold></gradient>'
    - '&7Mesa: &f{TABLE} &8| &7Jugadores: &f{PLAYERS}'
    - '&7Estado: &b{STATE} &8| &e{COUNTDOWN}s'
    - '&7En juego: &a{TOTAL}'
    - '&7Resultado: &6{RESULT} &7({COLOR})'
  pockets:
    red:
      material: RED_WOOL
      base64: ''
      display_name: '&cRojo'
      custom_model_data: 0
    black:
      material: BLACK_WOOL
      base64: ''
      display_name: '&8Negro'
      custom_model_data: 0
    green:
      material: LIME_WOOL
      base64: ''
      display_name: '&aCero'
      custom_model_data: 0
  winner:
    material: SEA_LANTERN
    base64: ''
    display_name: '&e✦ Ganador'
    custom_model_data: 0
  pointer:
    material: ARROW
    base64: ''
    display_name: '&eFlecha de resultado'
    custom_model_data: 0

