name: NewJobs
version: '1.1.3'
main: github.dstudio.newjobs.NewJobs
api-version: '1.18'
authors: [dStudios]
description: Trabajos profesionales, GUI configurable, XP, contratos y recompensas.
libraries:
  - com.h2database:h2:2.2.224
  - com.zaxxer:HikariCP:5.1.0
  - mysql:mysql-connector-java:8.0.33
  - org.mongodb:bson:4.11.1
  - org.mongodb:mongodb-driver-core:4.11.1
  - org.mongodb:mongodb-driver-sync:4.11.1
  - org.slf4j:slf4j-api:2.0.9
softdepend: [Vault, PlaceholderAPI, WorldGuard]
commands:
  jobs:
    description: Abre el panel de trabajos de NewJobs
    aliases: [job, trabajos, trabajo, newjobs]
    usage: /jobs [menu|join|leave|info|quests|contracts|rewards|top|reload]
permissions:
  newjobs.use:
    default: true
  newjobs.admin:
    default: op
  newjobs.bypass.limit:
    default: op
  newjobs.bypass.world:
    default: op
