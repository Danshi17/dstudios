          - "&aRewards"
          - "&7| &f500 RubyCoins"
          - ""
          - "&e<< Click to claim the reward >>"
      commands:
        - "rubys give %player% 500"
    premium:
      item:
        material: "NETHER_STAR"
        name: "&dLevel 3 &7(Premium)"
        lore:
          - "&aInformation"
          - "&7| Type: &dPremium Reward"
          - ""
          - "&aRewards"
          - "&7| &d1000 RubyCoins"
          - "&7| &f1x Nether Star"
          - ""
          - "&e<< Click to claim the reward >>"
      commands:
        - "rubys give %player% 1000"
        - "give %player% nether_star 1"

