  # ═══════════════════════════════════════════════════════════
  # EJEMPLOS DE AUTO-SELL (venta automática al minar)
  #
  # Esta opción SOLO existe en items.yml (no aparece en la GUI a
  # propósito, para no complicar el editor visual). Se configura
  # dentro de "mining.auto-sell" de una herramienta (type: TOOL):
  #
  #   mining:
  #     auto-sell:
  #       enabled: true              # activa/desactiva la venta automática
  #       blocks:                    # bloques cuyos drops se venden solos
  #         - MELON
  #       fallback-drop: true        # si un drop no tiene precio en la shop,
  #                                  # se dropea normal en vez de perderse
  #       sell-multiplier: 1.0       # multiplicador extra sobre el precio de venta
  #       message: "&a✔ &fVendiste &e%amount%x %item% &fpor &a$%price%"
  #
  # Requiere Vault + ShopGUI+ instalados y con precios de venta
  # configurados para los items que se quieran vender (ej. MELON_SLICE,
  # NETHER_WART, WHEAT, CARROT, POTATO, BEETROOT). Si no hay precio
  # de venta o los plugins no están instalados, el bloque se dropea
  # con normalidad (no se pierde nada).
  # ═══════════════════════════════════════════════════════════

  hacha_vendedora:
