settings:
  max-bossbars: 1
  action-bar-cycle-seconds: 10
  click-cache-seconds: 2

events:
  vault_rain:
    enabled: true
    display-name: "&a&lVault Rain"
    weight: 4
    required-mining-seconds: 150
    duration-seconds: 45
    max-stacks: 5
    chance: 100

    title: "&a&l[VAULT RAIN]"
    subtitle: "&2+200% Vault por {duration}s!"
    action-bar: "&aVault Rain &7[&e{stack}&7/&e{max_stack}&7] &8| &2+200% Vault &8(&e{remaining}s&8)"
    sound: "ORB_PICKUP"
    sound-volume: 1.0
    sound-pitch: 0.8
    particle: "VILLAGER_HAPPY"
    particle-count: 50

    bossbar:
      enabled: false
      title: "&a&l[VAULT RAIN] &7| &e{remaining}s restantes &7(&e{stack}&7/&e{max_stack}&7)"
      color: "PURPLE"
      style: "SOLID"

    end-title: "&c&l[FIN DE LA LLUVIA]"
    end-subtitle: "&7El Vault Rain ha finalizado."
    end-action-bar: "&cVault Rain terminado."
    end-sound: "ANVIL_BREAK"
    end-sound-volume: 1.0
    end-sound-pitch: 0.9
    end-particle: "SMOKE"
    end-particle-count: 25

    boosters:
      Vault: 3.0

  token_boost:
    enabled: true
    display-name: "&6&lToken Boost"
    weight: 10
    required-mining-seconds: 60
    duration-seconds: 30
    max-stacks: 5
    chance: 100

    title: "&6&l[TOKEN BOOST]"
    subtitle: "&e+50% Tokens por {duration}s!"
    action-bar: "&6Token Boost &7[&e{stack}&7/&e{max_stack}&7] &8| &e+50% Tokens &8(&e{remaining}s&8)"
    sound: "LEVEL_UP"
    sound-volume: 1.0
    sound-pitch: 1.2
    particle: "VILLAGER_HAPPY"
    particle-count: 30

    bossbar:
      enabled: false
      title: "&6&l[TOKEN BOOST] &7| &e{remaining}s restantes &7(&e{stack}&7/&e{max_stack}&7)"
      color: "PURPLE"
      style: "SOLID"

    end-title: "&c&l[BOOST FINALIZADO]"
    end-subtitle: "&7El Token Boost ha terminado."
    end-action-bar: "&cToken Boost finalizado."
    end-sound: "ANVIL_LAND"
    end-sound-volume: 1.0
    end-sound-pitch: 0.8
    end-particle: "SMOKE"
    end-particle-count: 15

    boosters:
      RevTokens: 1.5
      Gems: 1.25

  gem_surge:
    enabled: true
    display-name: "&b&lGem Surge"
    weight: 8
    required-mining-seconds: 90
    duration-seconds: 20
    max-stacks: 3
    chance: 100

    title: "&b&l[GEM SURGE]"
    subtitle: "&3+75% Gems por {duration}s!"
    action-bar: "&bGem Surge &7[&e{stack}&7/&e{max_stack}&7] &8| &3+75% Gems &8(&e{remaining}s&8)"
    sound: "BEACON_ACTIVATE"
    sound-volume: 1.0
    sound-pitch: 1.5
    particle: "FIREWORKS_SPARK"
    particle-count: 40

    bossbar:
      enabled: false
      title: "&b&l[GEM SURGE] &7| &e{remaining}s restantes &7(&e{stack}&7/&e{max_stack}&7)"
      color: "PURPLE"
      style: "SOLID"

    end-title: "&c&l[EVENTO TERMINADO]"
    end-subtitle: "&7El Gem Surge ha llegado a su fin."
    end-action-bar: "&cGem Surge finalizado."
    end-sound: "BEACON_DEACTIVATE"
    end-sound-volume: 1.0
    end-sound-pitch: 1.0
    end-particle: "SMOKE"
    end-particle-count: 20

    boosters:
      Gems: 1.75

  money_rain:
    enabled: true
    display-name: "&a&lMoney Rain"
    weight: 5
    required-mining-seconds: 120
    duration-seconds: 45
    max-stacks: 5
    chance: 100

    title: "&a&l[MONEY RAIN]"
    subtitle: "&2+100% Money por {duration}s!"
    action-bar: "&aMoney Rain &7[&e{stack}&7/&e{max_stack}&7] &8| &2+100% Money &8(&e{remaining}s&8)"
    sound: "ORB_PICKUP"
    sound-volume: 1.0
    sound-pitch: 0.8
    particle: "VILLAGER_HAPPY"
    particle-count: 50

    bossbar:
      enabled: false
      title: "&a&l[MONEY RAIN] &7| &e{remaining}s restantes &7(&e{stack}&7/&e{max_stack}&7)"
      color: "PURPLE"
      style: "SOLID"

    end-title: "&c&l[FIN DE LA LLUVIA]"
    end-subtitle: "&7El Money Rain ha finalizado."
    end-action-bar: "&cMoney Rain terminado."
    end-sound: "ANVIL_BREAK"
    end-sound-volume: 1.0
    end-sound-pitch: 0.9
    end-particle: "SMOKE"
    end-particle-count: 25

    boosters:
      Money: 2.0
      RevTokens: 1.3