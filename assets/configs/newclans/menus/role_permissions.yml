id: role_permissions
title: '<dark_gray>Permissions <gray>»</gray> %role_display%</dark_gray>'
rows: 6
page-size: 28
open-sound: UI_BUTTON_CLICK

dynamic:
  type: PERMISSIONS
  slots: '10-16,19-25,28-34,37-43'
  material: '%permission_state_material%'
  name: '<yellow>%permission_name%</yellow>'
  lore:
    - '<gray>Enabled: <white>%permission_enabled%</white></gray>'
    - ''
    - '<yellow>Click to toggle.</yellow>'

items:
  border:
    material: GRAY_STAINED_GLASS_PANE
    name: ' '
    slots: '0-8,9,17,18,26,27,35,36,44,45-53'
  reset:
    slot: 47
    material: REDSTONE
    name: '<red>Reset Role Permissions</red>'
    action: ROLE_RESET
  previous:
    slot: 48
    material: ARROW
    name: '<yellow>Previous Page</yellow>'
    action: PAGE_PREVIOUS
  back:
    slot: 49
    material: OAK_DOOR
    name: '<red>Back</red>'
    action: OPEN:clan_roles
  next:
    slot: 50
    material: ARROW
    name: '<yellow>Next Page</yellow>'
    action: PAGE_NEXT
