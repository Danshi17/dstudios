      2: { summary: "&eTempban 3d", commands: ["litebans:tempban %player% 3d Teaming [%modality%]"] }
      3: { summary: "&cTempban 7d", commands: ["litebans:tempban %player% 7d Teaming [%modality%]"] }

  insultos:
