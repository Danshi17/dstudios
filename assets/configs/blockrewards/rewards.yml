#  BlockRewards - Definicion de recompensas por nivel
#  Version 1.8.8  |  TODOS los materiales y nombres son
#  compatibles con Bukkit/Spigot 1.8.x
#
#  Cada tier tiene 4 estados visuales:
#    - ready      : listo para abrir (readyCount > 0)
#    - locked     : en progreso (1..required-1)
#    - not-found  : nunca se encontro
#    - claimed    : ya se abrio, esperando proximo desbloqueo
#
tier_cobre:
  display-name: "&6&lRecompensa de Cobre"
  order: 1
  material:
    ready: "GOLD_INGOT"
    locked: "STONE"
    not-found: "COBBLESTONE"
    claimed: "GOLD_NUGGET"
  name:
    ready: "&6&lRecompensa de Cobre &a(LISTA)"
    locked: "&7&lRecompensa de Cobre"
    not-found: "&8&lRecompensa de Cobre"
    claimed: "&8&lRecompensa de Cobre &7(Reclamada)"
  lore:
    ready:
      - ""
      - "&8&m-----------"
      - "&aTienes &e{ready} &alisto(s)!"
      - "&7Click para abrir una."
      - "&8&m-----------"
    locked:
      - ""
      - "&8&m-----------"
      - "&7Progreso: &e{progress}&7/&e{required}"
      - "&cSigue minando!"
      - "&8&m-----------"
    not-found:
      - ""
      - "&8&m-----------"
      - "&7Aun no has encontrado este nivel."
      - "&7Minera bloques para empezar."
      - "&8&m-----------"
    claimed:
      - ""
      - "&8&m-----------"
      - "&7Ya reclamaste este nivel."
      - "&7Sigue minando para desbloquear"
      - "&7el siguiente."
      - ""
      - "&8Click para cerrar."
      - "&8&m-----------"
  block:
    material: "STONE"
    required: 100
  chance: 100.0
  rewards:
    - weight: 5
      commands:
        - "give {player} GOLD_INGOT 4"
        - "tell {player} &7Has recibido &e4 lingotes de oro&7."
      title: "&6&lRecompensa!"
      subtitle: "&74 lingotes de oro"
      actionbar: "&7+4 Oro"
      sound: "ITEM_PICKUP"
      sound-volume: 1.0
      sound-pitch: 1.2
      particle: "HAPPY_VILLAGER"
      particle-count: 10

